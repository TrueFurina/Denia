name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Windows runner 默认控制台编码不是 UTF-8；项目里的中文输出会抛
# UnicodeEncodeError: 'charmap' codec ...（2026-10-28 实测）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: syntax gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: byte-compile (hard gate)
        run: python -m compileall -q src main.py tools
      - name: validate requirements syntax (advisory)
        continue-on-error: true
        run: python tools/check_requirements.py

  self-check:
    name: self-check scripts
    needs: syntax
    runs-on: windows-latest
    env:
      # 多数条目需要音频设备 / 桌面会话 / 外设，Windows runner 上没有，跑必红；
      # test_phash.py 需要 imagehash（项目刻意不装，避免拖入 109MB 的 scipy）。
      # test_doctor.py 不在 SKIP 里：2026-11-08 把它第 [3] 节的
      # 「当前开发机不应有 FAIL」（随机器变化）改成结构性契约后，配合下面的
      # 标准首跑布局（data/ + config.yaml 模板）即可在 runner 上稳定跑。
      # test_wake_word.py 第 1 节需 pypinyin 真实字典（已进 requirements-test.txt），
      # 第 10 节刻意模拟「未安装」降级，仍需真机验过再决定。
      SKIP: >-
        test_asr_event_flow.py test_asr_voice_pipeline.py test_dialogue_voice_chain.py
        test_doctor_asr.py test_doctor_voice_backend.py
        test_doctor_llm_channel.py test_doctor_config_warn.py
        test_autostart.py test_setup_hint.py test_wake_word.py
        test_perception_indicator.py
        test_pet_backend.py test_pet_shell_fallback.py test_pet_shell_selfheal.py
        test_pet_state.py
        test_phash.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt sounddevice
      # CI checkout 里没有 config.yaml（.gitignore:28）也没有 data/；
      # 这正是产品「源码包首跑」的标准动作，test_doctor.py 的 [6b] 也在验它。
      - name: prepare standard first-run layout
        run: python -c "import os,shutil;os.makedirs('data',exist_ok=True);shutil.copyfile('config.release.yaml','config.yaml')"
      - name: run every test_*.py as a script
        shell: pwsh
        run: |
          $skip = @($env:SKIP -split '\s+' | Where-Object { $_ })
          $ran = 0; $failed = @()
          foreach ($f in Get-ChildItem src/tests/test_*.py | Sort-Object Name) {
            if ($skip -contains $f.Name) { Write-Host "::group::跳过 $($f.Name)（需音频/桌面）"; Write-Host "::endgroup::"; continue }
            $ran++
            Write-Host "::group::$($f.Name)"
            python $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error file=src/tests/$($f.Name)::自检失败（exit $LASTEXITCODE）"
              $failed += $f.Name
            }
            Write-Host "::endgroup::"
          }
          Write-Host ""
          Write-Host ("执行 {0} 个，通过 {1}，失败 {2}" -f $ran, ($ran - $failed.Count), $failed.Count)
          if ($failed.Count -gt 0) {
            Write-Host ("失败清单: " + ($failed -join ', '))
            # 只打 annotation 不退出码 = 假绿。这里必须让 job 真红。
            exit 1
          }

  pytest:
    name: pytest (standalone modules only)
    needs: syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt sounddevice
      - name: pytest
        run: python -m pytest src/tests -q -p no:cacheprovider

  portable-gates:
    name: portable gates (stdlib only)
    runs-on: windows-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 只放纯 stdlib、不依赖 .venv / 音频设备 / 桌面会话的判据。
      # 2026-11-08 合并 PR #1 时发现：原 self-check 只遍历 src/tests/，
      # 且 SKIP 列表跳过该 PR 修的 test_doctor.py / test_wake_word.py，
      # tools/ 下 195 道 GATES 一道都没进 CI —— CI 全绿曾是零覆盖。
      # 其余 tools/ 闸门多硬编码开发机 venv 解释器或需要外设，仍由本机
      # check_all.py --fast 负责，整体塞进 CI 只会制造假红。
      # 拆成两个 step：Windows 默认 shell 的多行脚本里，前一条命令失败
      # 会被后一条的退出码覆盖，合并写会漏报红。
      - name: gate lock judgement
        run: python tools/test_gate_lock.py
      - name: gate lock mutation (five knives)
        run: python tools/_qc_gate_lock_mutation.py
      # 【2026-11-08 PR #11】纯 stdlib、只读 AST、699 个文件约 2s，符合本 job 的收录口径。
      # 判据：`finally` 里出现 return / break / continue —— 它会吞掉正在抛出的异常，
      # 并且退出的是整个函数（其后排着的清理一条都不执行）。全仓曾经只有一处
      # （webapp._run_voice_test），修完 0 处；这两步就是防它回潮。
      - name: finally-jump judgement
        run: python tools/check_finally_jump.py --all src tools main.py launch_companion.py run_webui.py
      - name: finally-jump mutation (eight knives)
        run: python tools/_qc_finally_jump_mutation.py
      # 【2026-11-08 补接线】下面六步是 PR #9 / #12 / #13 里**明确推迟**的接线：
      # 三个 PR 都要往本 job 末尾追加，同时追加必然互相冲突，所以各自在 body 里留了
      # 待办。三道闸门现在都已合入 master，且在本机实测全绿、纯 stdlib、总耗时 17s，
      # 符合本 job 的收录口径（不需要 .venv / 音频设备 / 桌面会话）。
      #
      # 为什么必须接：这三道闸门守的都是「代码看起来对、其实没生效」——
      #   · unreachable      ：必返回语句之后还排着代码（#7 删了 329 行，全仓曾 5 处）
      #   · constant-cond    ：`if False:` / `a or True` 这类恒真恒假条件（全仓曾 10 处）
      #   · gate-exit        ：登记在 GATES 里却永远 exit 0 的闸门（曾 3 处，永远绿）
      # 只登记进 GATES 而 CI 不跑，等于「本机才守」；接进 CI 才挡得住别人合进来。
      - name: unreachable judgement
        run: python tools/check_unreachable.py
      - name: unreachable mutation (six knives)
        run: python tools/_qc_unreachable_mutation.py
      - name: constant-cond judgement
        run: python tools/check_constant_cond.py --all src tools main.py launch_companion.py run_webui.py
      - name: constant-cond mutation (thirteen knives)
        run: python tools/_qc_constant_cond_mutation.py
      - name: gate exit judgement
        run: python tools/check_gate_exit.py
      - name: gate exit mutation (fifteen knives)
        run: python tools/_qc_gate_exit_mutation.py
