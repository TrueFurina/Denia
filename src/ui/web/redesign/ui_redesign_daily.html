  <script>



const root = document.documentElement;

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const app = document.querySelector('.daily-app');

const deckBody = document.getElementById('deckBody');

const deckDate = document.getElementById('deckDate');

const deckHint = document.getElementById('deckHint');

const expandBtn = document.getElementById('expandBtn');

const expPath = document.getElementById('expPath');

const expLabel = document.getElementById('expLabel');

const mdCache = {};

const existing = { daily: new Set(), weekly: new Set() };

const S = { mode: 'day', expanded: false, day: new Date(), weekMon: null };

S.weekMon = weekStartMonday(S.day);



/* 主题色 / 深浅模式由 app_backend.js?v=20261015f 的 window.Theme 统一处理（首屏前执行，并会清理自定义色残留的内联变量），此处不再重复实现。 */



/* ---------- 日期工具 ---------- */

const WD = ['周日','周一','周二','周三','周四','周五','周六'];

function pad(n){ return String(n).padStart(2,'0'); }

function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }

function weekStartMonday(d){ const x = new Date(d); x.setHours(0,0,0,0); const day = x.getDay(); const diff = (day===0? -6 : 1-day); x.setDate(x.getDate()+diff); return x; }

function weekDates(mon){ return Array.from({length:7}, (_,i)=> addDays(mon, i)); }



/* ---------- Markdown 渲染 ---------- */

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

function mdToHtml(md){

  const lines = (md||'').split('\n');

  let html='', inList=false, sectionOpen=false;

  const closeList=()=>{ if(inList){ html+='</ul>'; inList=false; } };

  const closeSec=()=>{ closeList(); if(sectionOpen){ html+='</div>'; sectionOpen=false; } };

  for (const ln of lines){

    const t = ln.trim();

    if (!t){ closeList(); continue; }

    let m;

    if ((m = t.match(/^##\s+(.*)$/))){ closeSec(); html+='<div class="sec"><span class="st">'+inline(m[1])+'</span>'; sectionOpen=true; }

    else if ((m = t.match(/^#\s+(.*)$/))){ closeSec(); html+='<h3>'+inline(m[1])+'</h3>'; }

    else if ((m = t.match(/^[-*]\s+(.*)$/))){ if(!inList){ html+='<ul>'; inList=true; } html+='<li>'+inline(m[1])+'</li>'; }

    else { closeList(); html+='<p>'+inline(t)+'</p>'; }

  }

  closeSec();

  return html;

}



/* ---------- 渲染：卡片（默认就展示当日活动 / 占位） ---------- */

async function buildCard(date, key){

  const wd = WD[date.getDay()];

  const card = document.createElement('article');

  card.className = 'daycard'; card.dataset.key = key;

  if (!existing.daily.has(key)){

    card.classList.add('empty');

    card.innerHTML =

      '<div class="rhead"><h3>'+key+'</h3><span class="rdate">'+wd+'</span></div>'+

      '<div class="rbody"><p class="ghost">当天无活动记录</p></div>';

    return card;

  }

  if (mdCache[key] === undefined){

    const r = await Backend.getReport('daily', key);

    mdCache[key] = (r && r.success) ? r.content : '';

  }

  const md = mdCache[key];

  card.innerHTML =

    '<div class="rhead"><h3>'+key+'</h3><span class="rdate">'+wd+'</span></div>'+

    '<div class="rbody">'+mdToHtml(md)+'</div>'+

    (md ? '<div class="actions"><button class="btn primary exp" type="button">导出</button><button class="btn cp" type="button">复制</button></div>' : '');

  return card;

}

async function renderDeck(){

  deckBody.innerHTML = '';

  deckBody.classList.remove('week');

  if (S.mode === 'day'){

    const card = await buildCard(S.day, fmt(S.day));

    deckBody.appendChild(card);

  } else {

    deckBody.classList.add('week');

    const expbar = document.createElement('div');

    expbar.className = 'expbar';

    expbar.innerHTML = '<button class="btn primary" id="expWeek" type="button">导出本周</button><span class="expbar-tip">每天以卡片展示，无记录的日子显示占位</span>';

    deckBody.appendChild(expbar);

    for (const d of weekDates(S.weekMon)){

      const card = await buildCard(d, fmt(d));

      deckBody.appendChild(card);

    }

  }

  applyCompact();

  updateDateLabel();

}

function applyCompact(){

  deckBody.querySelectorAll('.daycard').forEach(c => c.classList.toggle('compact', !S.expanded));

  deckHint.style.display = S.expanded ? 'none' : '';

}

function updateDateLabel(){

  if (S.mode === 'day'){ deckDate.textContent = fmt(S.day) + ' ' + WD[S.day.getDay()]; }

  else { const ds = weekDates(S.weekMon); deckDate.textContent = fmt(ds[0]).slice(5) + ' → ' + fmt(ds[6]).slice(5) + ' 本周'; }

}



/* ---------- 导出 / 复制 ---------- */

function downloadMd(name, md){

  if (!md){ Backend.toast('暂无内容可导出','err'); return; }

  Backend.exportMarkdown({name: name, content: md}).then(function(r){

    if (r && r.success){ Backend.toast('已导出到：' + r.folder); }

    else { Backend.toast((r && r.error) ? ('导出失败：' + r.error) : '导出失败', 'err'); }

  }).catch(function(){ Backend.toast('导出失败', 'err'); });

}

function copyText(t){

  if (!t){ Backend.toast('暂无内容可复制','err'); return; }

  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>Backend.toast('已复制'), ()=>Backend.toast('复制失败','err'));

  else Backend.toast('浏览器不支持复制','err');

}

deckBody.addEventListener('click', function(e){

  const btn = e.target.closest('.exp, .cp');

  if (btn){

    const card = btn.closest('.daycard'); const key = card && card.dataset.key;

    if (btn.classList.contains('exp')) downloadMd(key, mdCache[key]||'');

    else copyText(mdCache[key]||'');

    return;

  }

  if (e.target.id === 'expWeek'){

    const ds = weekDates(S.weekMon);

    const parts = ds.map(d => { const k = fmt(d); return existing.daily.has(k) ? ('# '+k+'\n'+(mdCache[k]||'')) : ('# '+k+'\n当天无活动记录'); });

    downloadMd(fmt(S.weekMon)+'_week', parts.join('\n\n'));

  }

});



/* ---------- 展开 / 收起（与返回同款 morph 形变） ---------- */

function setExpanded(v){

  if (S.expanded === v) return;

  S.expanded = v; app.dataset.expanded = v ? 'true' : 'false';

  applyCompact();

  expLabel.textContent = v ? '返回' : '展开';

  if (window.Morph) window.Morph.to(expPath, v ? 'chevronLeft' : 'expand');

  if (window.gsap && !reduce) gsap.fromTo(expandBtn.querySelector('svg'), { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: .32, ease: 'back.out(2)' });

}

expandBtn.addEventListener('click', () => setExpanded(!S.expanded));



/* ---------- 左右滑动切换（仅折叠态可翻） ---------- */

let lastDir = 1, swipeMoved = false, pStartX = 0;

function slideAnim(){

  if (window.gsap && !reduce) gsap.fromTo(deckBody, { x: (lastDir>0?-18:18), opacity: .4 }, { x: 0, opacity: 1, duration: .3, ease: 'power2.out' });

}

function nav(dir){

  if (S.expanded) return;            /* 展开态禁用滑动，仅返回可操作 */

  lastDir = dir;

  if (S.mode === 'day') S.day = addDays(S.day, dir);

  else S.weekMon = addDays(S.weekMon, dir*7);

  renderDeck().then(slideAnim);

}

document.getElementById('prevBtn').addEventListener('click', () => nav(-1));

document.getElementById('nextBtn').addEventListener('click', () => nav(1));

deckBody.addEventListener('pointerdown', e => { if (S.expanded) return; pStartX = e.clientX; swipeMoved = false; });

deckBody.addEventListener('pointermove', e => { if (S.expanded) return; if (Math.abs(e.clientX - pStartX) > 8) swipeMoved = true; });

deckBody.addEventListener('pointerup', e => {

  if (S.expanded) return;

  const dx = e.clientX - pStartX;

  if (Math.abs(dx) > 40){ nav(dx < 0 ? 1 : -1); swipeMoved = true; }

});



/* ---------- 模式切换 ---------- */

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', function(){

  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on')); t.classList.add('on');

  S.mode = t.dataset.tab; app.dataset.mode = S.mode;

  setExpanded(false);

  document.querySelectorAll('.tab .tab-check path').forEach(p => { if (window.Morph) window.Morph.to(p, p.closest('.tab').classList.contains('on') ? 'check' : 'dot'); });

  renderDeck();

}));

/* 横向紧挨的小卡片（日报 / 周报）：选中背景块横向位移过去。

   Fx 内部用 MutationObserver 盯着 .on 的变化，上面切 tab 时会自动跟着移动。 */

if (window.Fx) window.Fx.segInit(document.querySelector('.tabs'));

document.addEventListener('morph-ready', function(){

  document.querySelectorAll('.tab .tab-check path').forEach(p => { if (window.Morph) window.Morph.to(p, p.closest('.tab').classList.contains('on') ? 'check' : 'dot'); });

});



/* ---------- 初始化 ---------- */

Backend.getReports().then(r => {

  if (!r || !r.success){ Backend.toast('日报获取失败（后端未连接）', 'err'); renderDeck(); return; }

  (r.daily||[]).forEach(k => existing.daily.add(k));

  (r.weekly||[]).forEach(k => existing.weekly.add(k));

  renderDeck();

}).catch(() => renderDeck());



if (window.gsap && !reduce && !window.__SPA_NAV){

  gsap.from('.top', { opacity:0, y:-6, duration:.4, ease:'power2.out' });

  gsap.from('.kicker, .lead, .tabs', { opacity:0, y:8, duration:.45, delay:.18, ease:'power2.out' });

  gsap.from('.deck', { opacity:0, y:16, duration:.5, delay:.28, ease:'power3.out' });

}

[document.getElementById('prevBtn'), document.getElementById('nextBtn'), expandBtn].forEach(b => {

  if (!b) return;

  b.addEventListener('mouseenter', () => { if (window.gsap && !reduce && b.querySelector('svg')) gsap.to(b.querySelector('svg'), { scale:1.18, duration:.3, ease:'back.out(2.2)' }); });

  b.addEventListener('mouseleave', () => { if (window.gsap && !reduce && b.querySelector('svg')) gsap.to(b.querySelector('svg'), { scale:1, duration:.25, ease:'power2.out' }); });

});



  </script>

<script src="/redesign/theme_manager.js?v=20261013d"></script>
