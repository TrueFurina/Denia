<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>达妮娅 · 初次见面</title>
<style>
:root{
  --bg:#0A0C12; --bg-2:#0D1018;
  --surface:rgba(255,255,255,.035); --surface-2:rgba(255,255,255,.06); --surface-3:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:#E9EDF6; --ink-2:#AEB7C9; --ink-3:#6C7689;
  --accent-1:#2DD4FF; --accent-2:#A06BFF;
  --ok:#2faa6a; --warn:#d98a00; --bad:#c0392b;
  --shadow-pop:0 24px 70px rgba(0,0,0,.55);
  --font:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
:root[data-theme="light"]{
  --bg:#F4F6FA; --bg-2:#FFFFFF;
  --surface:rgba(15,22,40,.025); --surface-2:rgba(15,22,40,.05); --surface-3:rgba(15,22,40,.08);
  --line:rgba(15,22,40,.10); --line-2:rgba(15,22,40,.18);
  --ink:#141B2B; --ink-2:#4A5468; --ink-3:#828DA3;
  --shadow-pop:0 24px 70px rgba(20,30,60,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(42% 40% at 16% 16%,color-mix(in srgb,var(--accent-1) 13%,transparent),transparent 62%),
             radial-gradient(46% 44% at 86% 80%,color-mix(in srgb,var(--accent-2) 15%,transparent),transparent 64%)}
.ob{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:26px 26px 130px}
.ob-kicker{font:600 11px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-1)}
.ob-h1{font-size:26px;margin:6px 0 8px;background:linear-gradient(90deg,var(--accent-1),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.ob-lead{color:var(--ink-2);font-size:13.5px;max-width:740px}
.ob-lead b{color:var(--ink)}
.ob-steps{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0 20px;color:var(--ink-3);font-size:12.5px}
.ob-steps .s{display:inline-flex;align-items:center;gap:7px}
.ob-steps .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:color-mix(in srgb,var(--accent-1) 16%,transparent);color:var(--accent-1)}

.ob-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:820px){.ob-grid{grid-template-columns:1fr}}
.ob-card{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;min-width:0;font:inherit;color:inherit;
  background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:15px;cursor:pointer;
  transition:border-color .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease)}
.ob-card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.ob-card:focus-visible{outline:2px solid var(--accent-1);outline-offset:3px}
.ob-card .hd{display:flex;align-items:center;gap:12px}
.ob-ico{position:relative;width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--accent-1);
  background:linear-gradient(120deg,color-mix(in srgb,var(--accent-1) 18%,transparent),color-mix(in srgb,var(--accent-2) 18%,transparent));
  border:1px solid var(--line-2)}
/* ⚠️ 必须是 .ob-sub：pages.css 有全局 `.sub{padding:14px}`，在 `*{box-sizing:border-box}` 下
   会把 19px 的徽标撑成 30px、盖住 44px 图标（同名类连坐，本项目老坑）。 */
.ob-ico .ob-sub{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;min-width:18px;min-height:18px;
  max-width:18px;max-height:18px;box-sizing:border-box;padding:0;margin:0;border:1px solid var(--line-2);
  border-radius:6px;display:grid;place-items:center;line-height:0;background:var(--bg-2);color:var(--accent-2);
  cursor:default;pointer-events:none;box-shadow:0 0 0 2px var(--surface-2)}
.ob-ico .ob-sub svg{width:11px;height:11px;display:block}
.ob-nm{font-weight:700;font-size:14.5px}
.ob-ds{color:var(--ink-3);font-size:11.5px}
.ob-st{margin-left:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:4px 10px;border-radius:99px;white-space:nowrap}
.ob-st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.ob-st.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.ob-st.none{color:var(--ink-3);background:var(--surface-3)}
.ob-cur{border-top:1px dashed var(--line);padding-top:10px}
.ob-cur .k{color:var(--ink-3);font-size:11px}
.ob-cur .v{font-family:var(--font-mono);font-size:12px;margin-top:3px;display:flex;align-items:center;gap:6px;word-break:break-all}
.ob-cur .v.empty{color:var(--ink-3);font-family:inherit}
.ob-go{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:9px;
  padding:8px 12px;color:var(--ink-2);font-size:12px;font-weight:600}
.ob-card:hover .ob-go{color:var(--accent-1);border-color:color-mix(in srgb,var(--accent-1) 45%,transparent);
  background:color-mix(in srgb,var(--accent-1) 10%,transparent)}

.ob-hero{grid-column:1/-1;position:relative;display:flex;align-items:center;gap:18px;width:100%;text-align:left;font:inherit;
  color:inherit;cursor:pointer;overflow:hidden;padding:20px 22px;border-radius:18px;
  border:1px solid color-mix(in srgb,var(--accent-1) 40%,var(--line));
  background:radial-gradient(120% 160% at 100% 0%,color-mix(in srgb,var(--accent-2) 20%,transparent),transparent 58%),
             radial-gradient(120% 160% at 0% 100%,color-mix(in srgb,var(--accent-1) 18%,transparent),transparent 58%),
             var(--surface-2);
  transition:border-color .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease)}
.ob-hero:hover{border-color:color-mix(in srgb,var(--accent-1) 70%,transparent);transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.ob-hero-ic{width:56px;height:56px;flex:none;border-radius:16px;display:grid;place-items:center;color:#06121a;
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));box-shadow:0 8px 22px color-mix(in srgb,var(--accent-1) 28%,transparent)}
.ob-hero-tx{min-width:0;flex:1}
.ob-hero-t{font-weight:800;font-size:18px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ob-hero-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;color:var(--accent-1);
  background:color-mix(in srgb,var(--accent-1) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent-1) 42%,transparent)}
.ob-hero-d{color:var(--ink-2);font-size:12.5px;margin-top:4px;max-width:620px}
.ob-hero-parts{display:flex;gap:8px;flex-wrap:wrap;flex:none}
.ob-part{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface-3);white-space:nowrap}
.ob-part.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.ob-part.none{color:var(--ink-3)}
.ob-dot{width:8px;height:8px;border-radius:50%;flex:none}
.ob-dot.ok{background:var(--ok)} .ob-dot.none{background:var(--ink-3)}
.ob-hero-cta{flex:none;display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;color:#06121a;
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));border-radius:11px;padding:11px 18px}
@media(max-width:820px){.ob-hero{flex-wrap:wrap}.ob-hero-cta{width:100%;justify-content:center}}

.ob-panel{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:none}
.ob-panel.open{display:block}
.ob-pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ob-prov{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:10px}
.ob-prov.rec{border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.ob-prov.off{opacity:.58;filter:grayscale(.25)}
.ob-prov .ph{display:flex;align-items:center;gap:10px}
.ob-prov .pnw{min-width:0;flex:1}
.ob-prov .pn{font-weight:700;font-size:13.5px}
.ob-prov .pc{color:var(--ink-3);font-size:11px}
.ob-fld{min-width:0}
.ob-fld.wide{grid-column:1/-1}
.ob-fld label{display:block;color:var(--ink-3);font-size:11px;margin-bottom:4px}
.ob-fld input,.ob-fld select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  padding:7px 9px;font-size:12.5px;font-family:var(--font-mono)}
.ob-fld input:focus,.ob-fld select:focus{outline:none;border-color:var(--accent-1)}
.ob-fld select{font-family:inherit;cursor:pointer}
.ob-fld input:disabled{color:var(--accent-1);opacity:.9}
.ob-prov .ft{display:flex;gap:9px;align-items:flex-end}
.ob-prov .ft .ob-fld{flex:1}
.ob-use{flex:none;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  border:none;color:#06121a;border-radius:9px;padding:8px 15px;font-weight:700;font-size:12.5px;cursor:pointer}
.ob-use:disabled{background:var(--surface-3);color:var(--ink-3);cursor:not-allowed}
.ob-hintline{color:var(--ink-3);font-size:11px;display:flex;gap:6px}
.ob-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ob-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3)}
.ob-tag.vision{color:var(--accent-1);border-color:color-mix(in srgb,var(--accent-1) 42%,transparent);background:color-mix(in srgb,var(--accent-1) 12%,transparent)}
.ob-tag.reason{color:var(--accent-2);border-color:color-mix(in srgb,var(--accent-2) 38%,transparent)}
.ob-tag.no{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.ob-one{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.ob-one{grid-template-columns:1fr}}
.ob-note{grid-column:1/-1;font-size:12px;color:var(--ink-2);display:flex;gap:9px;background:color-mix(in srgb,var(--accent-1) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--accent-1) 26%,transparent);border-radius:12px;padding:11px 13px}
.ob-note b{color:var(--accent-1)}

.ob-bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:flex-end;
  padding:14px 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.ob-bar .tip{margin-right:auto;color:var(--ink-3);font-size:12px}
.ob-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .16s,background .16s,transform .16s}
.ob-btn:hover{border-color:var(--line-2);background:var(--surface-3)}
.ob-btn.primary{background:linear-gradient(135deg,var(--accent-1),var(--accent-2));border:none;color:#06121a}
.ob-btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.ob-empty{color:var(--ink-3);font-size:13px;padding:22px;text-align:center;grid-column:1/-1}
.ob-toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:9;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:12px;padding:10px 16px;box-shadow:var(--shadow-pop);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="ob">
  <div class="ob-kicker">初次见面</div>
  <h1 class="ob-h1">你好，我是达妮娅</h1>
  <p class="ob-lead">先花一分钟，把「我用什么模型」定下来。我把它分成 4 个<b>能力槽</b>：对话、看屏、说话、通话。<br>
    最省事的办法——在最上面填一个<b>阿里云百炼</b>的 Key，下面几格我一次帮你配好；也可以每一格单独挑你喜欢的服务商。以后随时能在「设置 → 模型与 API」里改。</p>

  <div class="ob-steps">
    <span class="s"><span class="n">1</span>填一把 Key（或挑服务商）</span>
    <span class="s"><span class="n">2</span>看状态变绿</span>
    <span class="s"><span class="n">3</span>开始使用</span>
  </div>

  <div class="ob-grid" id="obGrid">
    <div class="ob-empty">正在读取配置…</div>
  </div>
</div>

<div class="ob-bar">
  <span class="tip" id="obTip">一个都不配也行，先进主页随便用用，之后再配。</span>
  <button class="ob-btn" id="obSkip" type="button">稍后再说，先进主页</button>
  <button class="ob-btn primary" id="obDone" type="button">开始使用 →</button>
</div>

<script>
(function(){
  "use strict";
  /* 主题跟随外壳（同源可读父文档）；读不到用深色。 */
  try{
    var pt = window.parent && window.parent.document && window.parent.document.documentElement.getAttribute("data-theme");
    if (pt === "light" || pt === "dark") document.documentElement.setAttribute("data-theme", pt);
  }catch(e){}

  /* 后端：本页在 iframe 里、自身不加载 app_backend.js；优先用父窗口的 Backend。 */
  function getB(){
    try{ if (window.Backend) return window.Backend; }catch(e){}
    try{ if (window.parent && window.parent.Backend) return window.parent.Backend; }catch(e){}
    return null;
  }

  var ORDER = ["aliyun","chat","tts","duplex"];
  var CAPCLS = {"视觉":"vision","视频":"vision","听":"vision","说":"vision","PDF":"vision","推理":"reason","工具":""};
  var ICON = {"aliyun":"sparkles","chat":"brain","tts":"volume-2","duplex":"phone"};

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  var FB = {
    "sparkles":'<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/>',
    "brain":'<path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.998 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125A4 4 0 0 0 3.477 10.9"/>',
    "eye":'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
    "volume-2":'<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>',
    "phone":'<path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>',
    "settings":'<path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/>',
    "arrow-right":'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    "check":'<path d="M20 6 9 17l-5-5"/>',
    "circle-check":'<circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/>',
    "circle-alert":'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
    "minus":'<path d="M5 12h14"/>'
  };
  function svg(name, size){
    try{ var D = (window.parent && window.parent.DIcon) || window.DIcon;
      if (D && D.has && D.has(name)) return D.svg(name, {size:size||16}); }catch(e){}
    var p = FB[name]; if (!p) return "";
    return '<svg width="'+(size||16)+'" height="'+(size||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
  }

  function logo(id, size){
    try{ var P = (window.parent && window.parent.ProviderLogo) || window.ProviderLogo;
      if (P) return P.html(id, {size:size||26}); }catch(e){}
    return '<span style="display:inline-grid;place-items:center;width:'+(size||26)+'px;height:'+(size||26)+'px;border-radius:9px;border:1px solid var(--line);font-weight:800">'+esc((id||"?").slice(0,1).toUpperCase())+'</span>';
  }
  function capsRow(caps, ctx){
    var h = "";
    (caps||[]).forEach(function(c){ h += '<span class="ob-tag '+(CAPCLS[c]||"")+'">'+esc(c)+'</span>'; });
    if ((caps||[]).indexOf("视觉")<0 && (caps||[]).indexOf("视频")<0 && (caps||[]).indexOf("听")<0)
      h += '<span class="ob-tag no">不支持看图</span>';
    if (ctx && ctx !== "—") h += '<span class="ob-tag">'+esc(ctx)+'</span>';
    return h;
  }

  function toast(msg){
    var t = document.createElement("div"); t.className = "ob-toast"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function(){ try{ t.remove(); }catch(e){} }, 2600);
  }

  var LAST = null, openCap = null, tries = 0;

  function load(){
    var B = getB();
    if (!B || typeof B.getCapabilitySlots !== "function"){
      if (tries++ < 24){ setTimeout(load, 150); return; }
      LAST = STATIC; render(); document.getElementById("obTip").textContent = "（未连接后端，仅展示样式）";
      return;
    }
    /* 超时兜底：没有 pywebview 时桥层 Promise 会一直挂着，靠 .then 页面会长时间空白。 */
    var settled = false;
    var timer = setTimeout(function(){ if (settled) return; settled = true; LAST = STATIC; render(); }, 4000);
    B.getCapabilitySlots().then(function(r){
      if (settled) return; settled = true; clearTimeout(timer);
      LAST = (r && r.success) ? r : STATIC; render();
    }).catch(function(){
      if (settled) return; settled = true; clearTimeout(timer);
      LAST = STATIC; render();
    });
  }

  function render(){
    var slots = (LAST && LAST.slots) || {};
    var order = (LAST && LAST.order) || ORDER;
    var grid = document.getElementById("obGrid");
    grid.innerHTML = "";
    order.forEach(function(id){
      var s = slots[id]; if (!s) return;
      grid.appendChild(id === "aliyun" ? renderHero(s) : renderCard(id, s));
    });
    var panel = document.createElement("div");
    panel.className = "ob-panel" + (openCap ? " open" : ""); panel.id = "obPanel";
    grid.appendChild(panel);
    if (openCap) fillPanel(openCap);
    updateTip();
  }

  function updateTip(){
    var el = document.getElementById("obTip"); if (!el || !LAST || !LAST.slots) return;
    var st = LAST.slots;
    var okN = ORDER.filter(function(k){ return st[k] && st[k].state === "ok"; }).length;
    el.textContent = okN ? ("已配好 " + okN + " 格，随时可以开始。") : "一个都不配也行，先进主页随便用用，之后再配。";
  }

  function stateIcon(st){ return st === "ok" ? svg("circle-check",12) : (st === "warn" ? svg("circle-alert",12) : svg("minus",12)); }

  function renderCard(id, s){
    var el = document.createElement("button");
    el.type = "button"; el.className = "ob-card";
    var sub = (id==="chat") ? '<span class="ob-sub">'+svg("eye",12)+'</span>' : "";
    var cur = (s.active && s.active.model)
      ? '<div class="v">'+logo(s.active.provider||"",16)+' <span>'+esc(s.active.model)+'</span></div>'
      : '<div class="v empty">'+esc(s.state_text||"还没配")+'</div>';
    el.innerHTML =
      '<div class="hd"><div class="ob-ico">'+svg(ICON[id]||"settings",23)+sub+'</div>'+
      '<div style="min-width:0"><div class="ob-nm">'+esc(s.title)+'</div><div class="ob-ds">'+esc(s.desc)+'</div></div>'+
      '<span class="ob-st '+s.state+'">'+stateIcon(s.state)+esc(s.state_text)+'</span></div>'+
      '<div class="ob-cur"><div class="k">当前生效</div>'+cur+'</div>'+
      '<div class="ob-go"><span>配置这一格</span>'+svg("arrow-right",15)+'</div>';
    el.addEventListener("click", function(){ togglePanel(id); });
    return el;
  }

  function renderHero(s){
    var el = document.createElement("button");
    el.type = "button"; el.className = "ob-hero";
    var parts = s.parts || {};
    function part(k, label){ return '<span class="ob-part '+(parts[k]?"ok":"none")+'"><span class="ob-dot '+(parts[k]?"ok":"none")+'"></span>'+esc(label)+'</span>'; }
    el.innerHTML =
      '<div class="ob-hero-ic">'+svg("sparkles",28)+'</div>'+
      '<div class="ob-hero-tx"><div class="ob-hero-t"><span>'+esc(s.title)+'</span><span class="ob-hero-badge">填一个 Key，全齐</span></div>'+
      '<div class="ob-hero-d">'+esc(s.desc)+'　同一把百炼 Key 同时喂给对话/看屏、语音合成、实时通话——不用一格一格填。</div></div>'+
      '<div class="ob-hero-parts">'+part("chat","对话·看屏")+part("tts","语音合成")+part("duplex","实时通话")+'</div>'+
      '<div class="ob-hero-cta"><span>'+(s.state==="ok"?"已配好 · 去调整":"一键配置")+'</span>'+svg("arrow-right",16)+'</div>';
    el.addEventListener("click", function(){ togglePanel("aliyun"); });
    return el;
  }

  function togglePanel(id){
    openCap = (openCap === id) ? null : id;
    render();
    var p = document.getElementById("obPanel");
    try{ if (p && p.classList.contains("open")) p.scrollIntoView({behavior:"smooth", block:"nearest"}); }catch(e){}
  }

  function fillPanel(cap){
    var panel = document.getElementById("obPanel"); if (!panel) return;
    var s = (LAST.slots && LAST.slots[cap]) || null; if (!s) return;
    panel.innerHTML = (cap === "aliyun") ? aliyunForm(s) : providerGrid(s);
    wire(cap, panel);
  }

  function aliyunForm(s){
    var p = (s.providers && s.providers[0]) || {};
    function opts(list){ return (list||[]).map(function(m){
      return '<option value="'+esc(m.id)+'" data-caps="'+esc((m.caps||[]).join("|"))+'" data-ctx="'+esc(m.ctx||"")+'">'+esc(m.id+(m.note?"（"+m.note+"）":""))+'</option>'; }).join(""); }
    return '<div class="ob-one">'+
      '<div class="ob-fld wide"><label>阿里云百炼 API Key（一个 Key 通吃三处）</label><input id="obAk" type="password" placeholder="sk-... 填入即连" autocomplete="off"></div>'+
      '<div class="ob-fld"><label>对话 / 看屏模型</label><select id="obChatM">'+opts(p.chat_models)+'</select><div class="ob-tags" id="obChatTags"></div></div>'+
      '<div class="ob-fld"><label>语音合成（TTS）</label><select id="obTtsM">'+opts(p.tts_models)+'</select></div>'+
      '<div class="ob-fld"><label>实时通话（双工）</label><select id="obDupM">'+opts(p.duplex_models)+'</select></div>'+
      '<div class="ob-fld wide"><button class="ob-use" id="obOne" type="button">'+svg("check",15)+'一键配好这三格</button></div>'+
      '<div class="ob-note">'+svg("circle-alert",15)+'<div><b>说明：</b>这把 Key 会写进「对话模型」「看屏视觉」「语音合成」「实时通话」四处。'+
      '语音克隆用百炼的 voice-enrollment，<b>复刻音色有有效期</b>，过期会自动回落到默认音。已配好的其它服务商不会被清掉。</div></div></div>';
  }

  function providerGrid(s){
    var html = '<div class="ob-pgrid">';
    (s.providers||[]).forEach(function(p){
      var adapted = (p.adapted !== false);
      var opts = (p.models||[]).map(function(m){
        var id = (typeof m==="string")?m:m.id, caps = (typeof m==="string")?[]:(m.caps||[]);
        var isText = caps.length && caps.indexOf("视觉")<0 && caps.indexOf("视频")<0 && caps.indexOf("听")<0;
        return '<option value="'+esc(id)+'" data-caps="'+esc(caps.join("|"))+'" data-ctx="'+esc((m&&m.ctx)||"")+'">'+esc(id+(caps.length?(isText?" · 纯文本":" · 视觉"):""))+'</option>';
      }).join("");
      var keyFld = p.local ? "" : '<div class="ob-fld"><label>API Key'+(p.needs_group?" / GroupId":"")+'</label><input class="ck_'+esc(p.id)+'" type="password" placeholder="sk-..." autocomplete="off"></div>';
      var use = adapted
        ? '<button class="ob-use ce_btn" data-pid="'+esc(p.id)+'" type="button">'+svg("check",14)+esc(p.configured?"更新":"启用")+'</button>'
        : '<button class="ob-use" type="button" disabled>适配中</button>';
      html += '<div class="ob-prov'+(p.configured?" rec":"")+(adapted?"":" off")+'">'+
        '<div class="ph">'+logo(p.logo||p.id,28)+'<div class="pnw"><div class="pn">'+esc(p.name)+'</div><div class="pc">'+esc(p.cn||"")+'</div></div></div>'+
        '<div class="ob-fld wide"><label>接口地址</label><input disabled value="'+esc(p.base_url||"")+'"></div>'+
        '<div class="ob-fld wide"><label>模型</label><select class="cm_'+esc(p.id)+'">'+opts+'</select><div class="ob-tags"></div></div>'+
        '<div class="ft">'+keyFld+use+'</div>'+
        (p.hint ? '<div class="ob-hintline">'+svg("circle-alert",13)+'<span>'+esc(p.hint)+'</span></div>' : '')+
        '</div>';
    });
    if (s.allows_custom){
      html += '<div class="ob-prov"><div class="ph">'+logo("custom",28)+'<div class="pnw"><div class="pn" style="color:var(--accent-2)">自定义 OpenAI 兼容接口</div><div class="pc">自建网关 / One-API</div></div></div>'+
        '<div class="ob-fld wide"><label>Base URL</label><input class="cu_url" placeholder="https://your-gateway/v1"></div>'+
        '<div class="ob-fld wide"><label>模型名（单）</label><input class="cu_model" placeholder="model-id"></div>'+
        '<div class="ft"><div class="ob-fld"><label>API Key</label><input class="cu_key" type="password" placeholder="sk-..."></div>'+
        '<button class="ob-use cu_btn" type="button">'+svg("arrow-right",14)+'填入</button></div></div>';
    }
    html += '</div>';
    return html;
  }

  function wire(cap, panel){
    Array.prototype.forEach.call(panel.querySelectorAll("select"), function(sel){
      var row = sel.parentNode.querySelector(".ob-tags");
      function upd(){ var o = sel.options[sel.selectedIndex]; if (!o || !row) return;
        row.innerHTML = capsRow((o.getAttribute("data-caps")||"").split("|").filter(Boolean), o.getAttribute("data-ctx")); }
      sel.addEventListener("change", upd); upd();
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".ce_btn"), function(btn){
      btn.addEventListener("click", function(){
        var pid = btn.getAttribute("data-pid");
        var sel = panel.querySelector(".cm_"+pid), key = panel.querySelector(".ck_"+pid);
        save({cap:cap, provider:pid, model:sel?sel.value:"", api_key:key?key.value:"", base_url:""});
      });
    });
    var cu = panel.querySelector(".cu_btn");
    if (cu) cu.addEventListener("click", function(){
      var url = panel.querySelector(".cu_url"), model = panel.querySelector(".cu_model"), key = panel.querySelector(".cu_key");
      if (!url.value || !model.value){ toast("自定义要填 Base URL 和模型名"); return; }
      save({cap:cap, is_custom:true, custom_url:url.value, custom_model:model.value, custom_key:key.value});
    });
    var one = panel.querySelector("#obOne");
    if (one) one.addEventListener("click", function(){
      var ak = panel.querySelector("#obAk");
      if (!ak || !ak.value){ toast("先填一下阿里云百炼的 API Key"); return; }
      save({cap:"aliyun", api_key:ak.value,
            chat_model:(panel.querySelector("#obChatM")||{}).value||"",
            tts_model:(panel.querySelector("#obTtsM")||{}).value||"",
            duplex_model:(panel.querySelector("#obDupM")||{}).value||""});
    });
  }

  function save(payload){
    var B = getB();
    if (!B || typeof B.setCapabilitySlot !== "function"){ toast("后端还没连上，稍后再试"); return; }
    B.setCapabilitySlot(payload).then(function(r){
      if (r && r.success){ toast("好了：" + (r.message||"")); openCap = null; load(); }
      else { toast("没能保存：" + ((r && r.error) || "")); }
    }).catch(function(){ toast("保存出错了"); });
  }

  /* 完成：按实际配了什么，回传合适的"陪伴模式"，让主页功能对得上。
     注意：模型选择已由 setCapabilitySlot 直接落盘；这里只决定"要不要准备本地引擎"，
     所以刻意不选会触发本地模型下载的档（避免用户选了云端却被拉本地模型）。 */
  function finish(skipped){
    var mode = "";
    if (!skipped && LAST && LAST.slots){
      var st = LAST.slots;
      var d = st.duplex || {}, parts = (st.aliyun && st.aliyun.parts) || {};
      var duplexOk = parts.duplex || d.state === "ok";
      var dupLoc = (d.active && d.active.loc) || "";
      var chatOk = st.chat && (st.chat.state === "ok" || st.chat.state === "warn");
      var ttsOk = st.tts && st.tts.state !== "none";
      if (duplexOk) mode = (dupLoc === "local") ? "本机免费" : "云端付费";
      else if (chatOk || ttsOk) mode = "纯聊天";
    }
    var msg = {type:"onboarding-done", mode: skipped ? "" : mode, tts:null, features:null};
    if (skipped || !mode) msg.skip = true;
    try{
      if (window.parent && window.parent !== window){ window.parent.postMessage(msg, "*"); return; }
    }catch(e){}
    toast("（预览模式）已标记引导完成");
  }

  document.getElementById("obSkip").addEventListener("click", function(){ finish(true); });
  document.getElementById("obDone").addEventListener("click", function(){ finish(false); });

  /* 离线静态预览（无后端时也能看到布局） */
  var STATIC = {order:ORDER, slots:{
    aliyun:{title:"阿里云一键",desc:"一个百炼 Key，一次配齐 对话 / 看屏 / 语音合成 / 实时通话",state:"none",state_text:"还没配",width:"full",parts:{chat:false,tts:false,duplex:false},
      providers:[{id:"bailian",name:"阿里云百炼",cn:"通义千问 Qwen（一个 Key 全通）",logo:"alibaba",base_url:"https://dashscope.aliyuncs.com/compatible-mode/v1",configured:false,rank:1,
        chat_models:[{id:"qwen3.8-omni-flash",caps:["视觉","视频","听","推理","工具"],ctx:"1M",note:"推荐"},{id:"qwen3-vl-plus",caps:["视觉","视频","推理","工具"],ctx:"1M",note:"看屏专用"}],
        tts_models:[{id:"qwen-audio-3.0-tts-plus",caps:["说"],ctx:"—"},{id:"cosyvoice-v3.5-plus",caps:["说"],ctx:"—"}],
        duplex_models:[{id:"qwen3.5-omni-flash-realtime",caps:["听","说","视觉"],ctx:"—"}]}]},
    chat:{title:"对话模型",desc:"文字对话 · 看屏 / 图像理解（合并成一格）",state:"none",state_text:"还没配",allows_custom:true,active:{},providers:[
      {id:"deepseek",name:"DeepSeek",cn:"深度求索",logo:"deepseek",base_url:"https://api.deepseek.com/v1",configured:false,rank:1,models:[{id:"deepseek-flash",caps:["视觉","推理","工具"],ctx:"1M"},{id:"deepseek-v4-pro",caps:["推理","工具"],ctx:"1M"}]},
      {id:"bailian",name:"阿里云百炼 Qwen",cn:"通义千问",logo:"alibaba",base_url:"https://dashscope.aliyuncs.com/compatible-mode/v1",configured:false,rank:2,models:[{id:"qwen3.8-omni-flash",caps:["视觉","视频","听","推理","工具"],ctx:"1M"}]},
      {id:"zhipu",name:"智谱 AI",cn:"GLM",logo:"zhipuai",base_url:"https://open.bigmodel.cn/api/paas/v4",configured:false,rank:3,models:[{id:"glm-5.3-flash",caps:["视觉","视频","推理","工具"],ctx:"1M"}]}]},
    tts:{title:"TTS 语音合成",desc:"让达妮娅用自己的声音说话",state:"none",state_text:"还没配",allows_custom:true,active:{},providers:[
      {id:"dashscope_cosy",name:"阿里云 CosyVoice",logo:"alibaba",base_url:"https://dashscope.aliyuncs.com/api-ws/v1/inference",configured:false,rank:1,clone:"y",models:[{id:"qwen-audio-3.0-tts-plus",caps:["说"],ctx:"—"}]},
      {id:"minimax",name:"MiniMax Speech",logo:"minimax",base_url:"https://api.minimaxi.com/v1/t2a_v2",configured:false,rank:2,clone:"y",needs_group:true,models:[{id:"speech-02-hd",caps:["说"],ctx:"—"}]},
      {id:"fish_audio",name:"Fish Audio",logo:"fishaudio",base_url:"https://api.fish.audio/v1/tts",configured:false,rank:3,clone:"y",models:[{id:"(克隆模型 _id)",caps:["说"],ctx:"—"}]}]},
    duplex:{title:"双工 实时通话",desc:"像打电话一样，边说边听",state:"none",state_text:"还没配",allows_custom:false,active:{},providers:[
      {id:"bailian_qwen_omni",name:"阿里云 百炼 Qwen-Omni Realtime",logo:"alibaba",base_url:"https://dashscope.aliyuncs.com",configured:false,rank:1,clone:"y",adapted:true,models:[{id:"qwen3.5-omni-flash-realtime",caps:["听","说","视觉"],ctx:"—"}]},
      {id:"local_comni",name:"本地 Comni（离线）",logo:"comni",base_url:"https://localhost:8006",configured:false,rank:2,clone:"n",adapted:true,local:true,models:[{id:"MiniCPM-o 4.5 (Q4_K_M)",caps:["听","说","视觉"],ctx:"—"}]},
      {id:"volcano",name:"火山引擎 豆包 Realtime",logo:"volcengine",base_url:"https://openspeech.bytedance.com",configured:false,rank:3,clone:"y",adapted:false,models:[{id:"doubao-realtime-sc-2.0",caps:["听","说"],ctx:"—"}]}]}
  }};

  load();
})();
</script>
