<html lang="zh-CN">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>通话记录 · 桌面伴侣</title>

<link rel="stylesheet" href="/redesign/design_tokens.css?v=20261013e" />

<link rel="stylesheet" href="/redesign/ui_shared.css?v=20261013e" />

<link rel="stylesheet" href="/redesign/pages.css?v=12" />



  <style>

    *{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }

    input, textarea, select, [contenteditable="true"]{ -webkit-user-select:text; user-select:text; }

    ::selection{ background:rgba(124,92,255,.25); }

    img, canvas, svg, video{ -webkit-user-drag:none; user-drag:none; }

    body{ -webkit-user-drag:none; }



    /* 关键：author CSS（display:flex 等）会压过 UA 的 [hidden]{display:none}。       必须显式提权，否则「列表」和「详情」会同时显示、排版挤爆。 */

    [hidden]{ display:none !important; }



    /* ===== 通话记录（全部走 design_tokens，跟随深浅主题与强调色） ===== */

    .call-wrap{ display:flex; flex-direction:column; height:100%; min-height:0; }

    .call-toolbar{

      display:flex; align-items:center; gap:10px; flex-wrap:wrap;

      padding:10px 0 14px; border-bottom:1px solid var(--line);

      margin-bottom:14px;

    }

    .call-count{ font-size:12px; color:var(--ink-3); font-family:var(--font-mono); }

    .call-live{

      display:inline-flex; align-items:center; gap:6px; font-size:12px;

      color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, transparent);

      border:1px solid color-mix(in srgb, var(--ok) 40%, transparent);

      border-radius:999px; padding:3px 10px;

    }

    .call-live i{ width:6px; height:6px; border-radius:50%; background:var(--ok); }

    .call-btn{

      font:inherit; font-size:12px; cursor:pointer; user-select:none;

      padding:5px 12px; border-radius:var(--r-2, 8px);

      border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);

      transition:background .15s, border-color .15s;

      /* 【2026-10-04 20:05 修·按钮文字被压成竖排】flex 容器宽度紧张时，

         中文按钮?*逐字换行**变成"刷\n??9:56 用户截图里「刷?清空」就是这样，

         按钮变成两个字的窄条、极难点中）。`nowrap` + `flex:none` 保证它不被压缩；

         `flex-shrink:0` 优先保住按钮，必要时先压缩左侧的标题文字?*/

      white-space:nowrap;

      flex:none;

    }

    .call-btn:hover{ background:var(--surface-3); border-color:var(--accent-1); color:var(--ink-1); }

    .call-btn.primary{ border-color:color-mix(in srgb, var(--accent-1) 55%, transparent); color:var(--accent-1); }

    .call-btn.danger:hover{ border-color:var(--bad); color:var(--bad); }

    /* 按钮行：标题可压缩换行，按钮永不压缩、不换行 */

    .call-acts{ display:flex; align-items:center; gap:8px; flex:none; }

    .call-acts-title{ flex:1; min-width:0; }



    /* —?列表视图 —?*/

    .call-list{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-bottom:20px; }

    .session-card{

      display:flex; gap:12px; align-items:flex-start; cursor:pointer;

      padding:13px 15px; border-radius:var(--r-2, 10px);

      background:var(--surface-1); border:1px solid var(--line);

      transition:border-color .15s, background .15s, transform .08s;

    }

    .session-card:hover{ border-color:var(--accent-1); background:var(--surface-2); }

    .session-card:active{ transform:scale(.995); }

    .session-card.active{ border-color:color-mix(in srgb, var(--accent-1) 60%, transparent); }

    .sess-av{

      flex:none; width:38px; height:38px; border-radius:50%;

      display:flex; align-items:center; justify-content:center;

      font-size:15px; font-weight:700; color:#06121a;

      background:linear-gradient(90deg, var(--accent-1), var(--accent-2));

    }

    /* 【2026-10-13】有角色/主题头像时，圆圈改显真图（此前恒为首字占位"达"）。
       走 html[data-tm-avatar="on"] 属性选择器由 CSS 自动生效 —— 主题头像是**异步**
       加载的，若只在渲染那一刻读变量会有竞态（列表先渲染、主题后到位 → 永远占位）。
       变量一设上，头像立刻出现，不依赖 JS 时机。JS 侧仍可用 .has-img 覆盖为角色头像。 */
    html[data-tm-avatar="on"] .sess-av,
    .sess-av.has-img{

      background-image: var(--tm-avatar);

      background-size:cover; background-position:50% 38%;

      color:transparent; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);

    }

    .sess-body{ flex:1; min-width:0; }

    .sess-top{ display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap; }

    .sess-name{ font-size:14px; font-weight:700; color:var(--ink-1); }

    .sess-badge{

      font-size:10px; color:var(--ink-3); font-family:var(--font-mono);

      border:1px solid var(--line); border-radius:4px; padding:1px 6px;

    }

    .sess-badge.live{ color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, transparent); background:color-mix(in srgb, var(--ok) 10%, transparent); }

    .sess-badge.audio{ color:var(--accent-1); border-color:color-mix(in srgb, var(--accent-1) 40%, transparent); }

    .sess-topic{

      font-size:13.5px; line-height:1.55; color:var(--ink-1); margin-bottom:6px;

      display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;

    }

    .sess-meta{ font-size:11.5px; color:var(--ink-3); font-family:var(--font-mono); }

    .sess-arrow{ flex:none; align-self:center; color:var(--ink-3); font-size:18px; }



    .call-empty{

      text-align:center; color:var(--ink-3); font-size:13px; padding:52px 20px; line-height:1.9;

    }

    .call-empty .big{ font-size:30px; display:block; margin-bottom:12px; opacity:.5; }



    /* —?详情视图 —?*/

    .call-detail{ flex:1; min-height:0; display:flex; flex-direction:column; }

    .detail-head{

      display:flex; align-items:center; gap:12px; padding:2px 0 14px;

      border-bottom:1px solid var(--line); margin-bottom:14px;

    }

    .detail-back{

      flex:none; cursor:pointer; font-size:13px; color:var(--ink-2);

      border:1px solid var(--line); background:var(--surface-2); border-radius:var(--r-2,8px);

      padding:5px 11px; user-select:none;

    }

    .detail-back:hover{ border-color:var(--accent-1); color:var(--ink-1); }

    /* 导出/返回按钮：禁止被 flex 压成竖排窄条（截图里"导出本次"变竖排就是它?*/

    .detail-head .call-btn{ white-space:nowrap; flex:none; align-self:center; }

    .detail-title{ flex:1; min-width:0; }

    .detail-title .dt-name{ font-size:15px; font-weight:700; color:var(--ink-1); }

    .detail-title .dt-sub{ font-size:11.5px; color:var(--ink-3); font-family:var(--font-mono); margin-top:2px; }

    .detail-body{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding-bottom:20px; }

    .bubble{ display:flex; gap:10px; align-items:flex-start; }

    .bubble.user{ flex-direction:row-reverse; }

    .bub-av{

      flex:none; width:30px; height:30px; border-radius:50%;

      display:flex; align-items:center; justify-content:center;

      font-size:12px; font-weight:700;

    }

    .bubble.assistant .bub-av{ color:#06121a; background:linear-gradient(90deg, var(--accent-1), var(--accent-2)); }

    .bubble.user .bub-av{

      color:var(--ink-2); background:var(--surface-3); border:1px solid var(--line);

    }

    .bub-main{ flex:1; min-width:0; max-width:82%; }

    .bubble.user .bub-main{ text-align:right; }

    .bub-meta{ display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap; }

    .bubble.user .bub-meta{ flex-direction:row-reverse; }

    .bub-who{ font-size:12px; font-weight:600; color:var(--ink-1); }

    .bub-time{ font-size:10.5px; color:var(--ink-3); font-family:var(--font-mono); }

    .bub-text{

      font-size:13.5px; line-height:1.62; color:var(--ink-1);

      background:var(--surface-1); border:1px solid var(--line);

      border-radius:var(--r-2,10px); padding:9px 12px; word-break:break-word;

      display:inline-block; max-width:100%;

    }

    .bubble.user .bub-text{ background:var(--surface-2); }

    .bub-audio{ margin-top:7px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    .bubble.user .bub-audio{ flex-direction:row-reverse; }

    .bub-audio audio{ height:30px; max-width:260px; }

    .bub-aud-tag{

      font-size:10px; color:var(--ink-3); font-family:var(--font-mono);

      border:1px solid var(--line); border-radius:4px; padding:1px 6px;

    }

    .call-toast{

      position:fixed; left:50%; bottom:26px; transform:translateX(-50%);

      background:var(--surface-2); border:1px solid var(--accent-1); color:var(--ink-1);

      font-size:12.5px; padding:9px 16px; border-radius:999px; box-shadow:var(--shadow-pop);

      opacity:0; pointer-events:none; transition:opacity .2s; z-index:50;

    }

    .call-toast.show{ opacity:1; }

  </style>

</head>

  <script>

  // ================= 通话记录（会话列表 / 详情 / 导出）=================

  // 数据源：

  //   Backend.getCallSessions()        — 会话列表（每次通话一段，含时?主题/角色名）

  //   Backend.getCallSessionDetail()   — 某会话双方逐句文本 + 语音 URL

  //   Backend.exportCallSession()      — 打包 zip（transcript.txt + 每句 wav）base64

  // 底层逐句记录（EventType.CALL_SPEECH 写入，绝不进聊天页）。
  (function(){

    var listEl = document.getElementById('callList');

    var detailEl = document.getElementById('callDetail');

    var detailBody = document.getElementById('detailBody');

    var countEl = document.getElementById('callCount');

    var liveEl = document.getElementById('callLive');

    var refreshBtn = document.getElementById('refreshBtn');

    var clearBtn = document.getElementById('clearBtn');

    var backBtn = document.getElementById('backBtn');

    var exportBtn = document.getElementById('exportBtn');

    var dtName = document.getElementById('dtName');

    var dtSub = document.getElementById('dtSub');

    var toastEl = document.getElementById('toast');



    var currentSessionId = null;



    function esc(s){

      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){

        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);

      });

    }

    function pad(n){ return (n < 10 ? '0' : '') + n; }

    function fmtDateTime(ts){

      try{

        var d = new Date((Number(ts) || 0) * 1000);

        return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())

          + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());

      }catch(e){ return '--'; }

    }

    function fmtTime(ts){

      try{

        var d = new Date((Number(ts) || 0) * 1000);

        return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());

      }catch(e){ return '--:--:--'; }

    }

    function fmtDuration(s){

      s = Math.max(0, Math.floor(Number(s) || 0));

      if(s < 60) return '时长 ' + s + ' 秒';

      var m = Math.floor(s/60), r = s%60;

      if(m < 60) return '时长 ' + m + ' 分' + (r ? (r + ' 秒') : '');

      var h = Math.floor(m/60); m = m%60;

      return '时长 ' + h + ' 小时' + (m ? (m + ' 分') : '');

    }

    function engineLabel(e){

      if(e === 'cloud_omni') return '云端双工';

      if(e === 'local_omni') return '本地双工';

      if(e === 'local') return '本地双工';

      if(e === 'realtime') return '云端双工';

      return e || '';

    }

    function toast(msg){

      toastEl.textContent = msg; toastEl.classList.add('show');

      clearTimeout(toast._t); toast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);

    }




    // —— 列表视图 ——
    function renderSessions(data){

      var sessions = (data && data.sessions) || [];

      var inCall = !!(data && data.in_call);

      var activeId = (data && data.active_session_id) || null;

      liveEl.hidden = !inCall;

      countEl.textContent = '·' + sessions.length + ' 次通话';

      if(!sessions.length){

        listEl.innerHTML = '<div class="call-empty"><span class="big">📞</span>'

          + '还没有通话记录<br>和达妮娅语音通话时，双方说的话会自动记到这里、按通话分成一段段会话。'

          + '每段都能回放语音、也能导出音频和文字<br>（通话记录与聊天记录是分开的两份，不会混在一起）</div>';

        return;

      }

      listEl.innerHTML = sessions.map(function(s){

        var isActive = s.id === activeId;

        var badges = '';

        if(isActive) badges += '<span class="sess-badge live">进行中</span>';

        if(s.engine) badges += '<span class="sess-badge">' + esc(engineLabel(s.engine)) + '</span>';

        if(s.has_audio) badges += '<span class="sess-badge audio">🔊 含语音</span>';

        return '<div class="session-card' + (isActive ? ' active' : '') + '" data-id="' + esc(s.id) + '">'

          + '<div class="sess-av">' + esc((s.char_name || '达').charAt(0)) + '</div>'

          + '<div class="sess-body">'

          +   '<div class="sess-top"><span class="sess-name">' + esc(s.char_name || '达妮娅') + '</span>' + badges + '</div>'

          +   '<div class="sess-topic">' + esc(s.topic || '通话记录') + '</div>'

          +   '<div class="sess-meta">' + fmtDateTime(s.start_ts)

          +     ' · ' + fmtDuration(s.duration_s)

          +     ' · ' + (s.count || 0) + ' 句（我 ' + (s.n_user||0) + ' / ' + (s.char_name||'达妮娅') + ' ' + (s.n_assistant||0) + '）</div>'

          + '</div>'

          + '<div class="sess-arrow">›</div></div>';

      }).join('');

      Array.prototype.forEach.call(listEl.querySelectorAll('.session-card'), function(card){

        card.addEventListener('click', function(){

          openDetail(card.getAttribute('data-id'));

        });

      });

      /* 头像：渲染即有图；主题/角色图稍后异步到位，再补一次 */
      applySessAvatars(); setTimeout(applySessAvatars, 500);

    }

    /* 【2026-10-13】会话头像：优先角色自带头像 → 主题头像（root 的 --tm-avatar）
       → 都没有则保持首字占位。此前恒为首字占位（硬编码 charAt(0)）。 */
    function applySessAvatars(){

      var url = '';

      try {

        var st = (window.ThemeManager && ThemeManager.state) || null;

        if (st && st.activeAvatar) url = '/local_img?path=' + encodeURIComponent(st.activeAvatar);

      } catch(e){}

      if (!url) {

        try {

          var v = getComputedStyle(document.documentElement).getPropertyValue('--tm-avatar') || '';

          var m = v.match(/url\((['"]?)(.+?)\1\)/);

          if (m && m[2] && m[2] !== 'none') url = m[2];

        } catch(e){}

      }

      var els = listEl.querySelectorAll('.sess-av');

      Array.prototype.forEach.call(els, function(el){

        if (url){ el.classList.add('has-img'); el.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")'; }

        else { el.classList.remove('has-img'); el.style.backgroundImage = ''; }

      });

    }



    // —— 详情视图 ——
    function openDetail(id){

      if(!Backend || !Backend.getCallSessionDetail) return;

      currentSessionId = id;

      Backend.getCallSessionDetail({ session_id: id }).then(function(r){

        if(!r || !r.success || !r.session){ toast('会话不存在或已过期'); return; }

        var s = r.session;

        dtName.textContent = s.char_name || '达妮娅';

        dtSub.textContent = fmtDateTime(s.start_ts) + ' ~ ' + fmtDateTime(s.end_ts)

          + ' · ' + fmtDuration(s.duration_s)

          + (s.engine ? ' · ' + engineLabel(s.engine) : '');

        var uts = (s.utterances || []).slice().sort(function(a,b){ return (a.ts||0)-(b.ts||0); });

        if(!uts.length){

          detailBody.innerHTML = '<div class="call-empty">这段会话还没有内容</div>';

        } else {

          detailBody.innerHTML = uts.map(function(u){

            var isUser = u.speaker === 'user';

            var who = isUser ? '我' : (u.char_name || '达妮娅');

            var audio = u.audio_url

              ? '<div class="bub-audio">'

                + (isUser ? '<span class="bub-aud-tag">你的声音</span>' : '')

                + '<audio controls preload="metadata" src="/' + esc(u.audio_url) + '"></audio></div>'

              : '<div class="bub-audio"><span class="bub-aud-tag">（无语音存档）</span></div>';

            return '<div class="bubble ' + (isUser ? 'user' : 'assistant') + '">'

              + '<div class="bub-av">' + (isUser ? '我' : esc(who.charAt(0))) + '</div>'

              + '<div class="bub-main">'

              +   '<div class="bub-meta"><span class="bub-who">' + esc(who) + '</span>'

              +     '<span class="bub-time">' + fmtTime(u.ts) + '</span></div>'

              +   '<div class="bub-text">' + esc(u.text || '') + '</div>'

              +   audio

              + '</div></div>';

          }).join('');

          detailBody.scrollTop = 0;

        }

        listEl.hidden = true;

        detailEl.hidden = false;

      }).catch(function(){ toast('加载详情失败'); });

    }



    function backToList(){

      detailEl.hidden = true;

      listEl.hidden = false;

      currentSessionId = null;

      loadSessions();

    }



    function exportCurrent(){

      if(!currentSessionId){ toast('请先打开一段会话'); return; }

      if(!Backend || !Backend.exportCallSession){ toast('后端不支持导出'); return; }

      var _old = exportBtn.textContent;

      exportBtn.disabled = true; exportBtn.textContent = '选择位置…';

      // 【2026-10-04 重写】后端现在**直接写磁盘**并弹文件夹选择框，

      // 不再走 blob 下载（WebView2 会静默拦截，点了没反应也没提示）
      Backend.exportCallSession({ session_id: currentSessionId }).then(function(r){

        exportBtn.disabled = false; exportBtn.textContent = _old;

        if(!r){ toast('导出失败：后端无返回'); return; }

        if(r.canceled){ toast('已取消导出'); return; }

        if(!r.success){ toast('导出失败：' + (r.error || '未知错误')); return; }

        var msg = '已导出到 ' + (r.folder || '') + '，共 ' + (r.text_count || 0) + ' 句文字 / '

                  + (r.audio_count || 0) + ' 个音频';

        toast(msg);

        showExportResult(r);

      }).catch(function(e){

        exportBtn.disabled = false; exportBtn.textContent = _old;

        toast('导出失败：' + (e && e.message ? e.message : '未知错误'));

      });

    }



    // 导出成功后的结果面板：如实显示保存路径 + 文件清单 + 一键打开文件夹。
    function showExportResult(r){

      var old = document.getElementById('exportResult');

      if(old) old.remove();

      var box = document.createElement('div');

      box.id = 'exportResult';

      box.style.cssText = 'margin:10px 0 0;padding:10px 12px;border-radius:10px;'

        + 'background:var(--surface-2);border:1px solid var(--line);font-size:12px;line-height:1.6';

      /* 【2026-10-04 22:15】把"完整通话.wav"**排到最前并高亮**。         此前?files.slice(0,8) 平铺，而完整通话排在?31 位之??         用户导出后在面板?完全看不到它"，以为导出失败（22:07/22:08 实锤两次）?*/

      var all = r.files || [];

      var mergedName = (all.filter(function(f){ return /完整通话/.test(f); }))[0] || '';

      var others = all.filter(function(f){ return !/完整通话/.test(f); });

      var files = others.slice(0, 6).join('、')

                + (others.length > 6 ? ' …等 ' + others.length + ' 个' : '');

      var mg = r.merged || {};

      box.innerHTML = '<div style="font-weight:600;margin-bottom:4px">✓ 导出完成</div>'

        + '<div style="color:var(--ink-2)">保存位置：</div>'

        + '<div style="font-family:var(--font-mono);word-break:break-all;color:var(--ink-1);margin-bottom:6px">'

        + String(r.folder || '').replace(/[<>&]/g, function(c){

            return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</div>'

        + (mg && mg.ok

            ? '<div style="padding:7px 9px;border-radius:8px;background:color-mix(in srgb,var(--accent-1) 12%,transparent);'

              + 'border:1px solid color-mix(in srgb,var(--accent-1) 45%,transparent);margin-bottom:6px">'

              + '<div style="color:var(--ink-1);font-weight:600">🎧 连贯音频已生成：'

              + Math.round(mg.duration || 0) + ' 秒（' + (mg.clips || 0) + ' 段拼接）</div>'

              + '<div style="color:var(--ink-2);margin-top:2px">「音频/」目录下的 <code>完整通话.wav</code>'

              + (mergedName.indexOf("mp3") >= 0 ? ' · <code>完整通话.mp3</code>' : '')

              + '，双击即可连着听完；逐句 wav 也还在同一目录。</div></div>'

            : '')

        + '<div style="color:var(--ink-2)">共 ' + (r.text_count || 0) + ' 句文字、'

        + (r.audio_count || 0) + ' 个逐句音频（含「文字/」「音频/」两个子目录）</div>'

        + (files ? '<div style="color:var(--ink-3);margin-top:3px">' + files + '</div>' : '')

        + '<div class="call-acts" style="margin-top:8px">'

        + (Backend && Backend.openExportFolder ? '<button class="call-btn" id="openExpDir" type="button">打开文件夹</button>' : '')

        + '<button class="call-btn" id="closeExpBox" type="button">知道了</button></div>';

      var body = document.getElementById('detailBody');

      (body || document.querySelector('.call-wrap')).insertBefore(box, body ? body.firstChild : null);

      var ob = document.getElementById('openExpDir');

      if(ob && Backend && Backend.openExportFolder){

        ob.addEventListener('click', function(){

          Backend.openExportFolder({ path: r.folder });

        });

      }

      var cb = document.getElementById('closeExpBox');

      if(cb) cb.addEventListener('click', function(){ box.remove(); });

    }



    function loadSessions(){

      if(typeof Backend === 'undefined') return;

      if(!Backend.getCallSessions) return;

      Backend.getCallSessions({}).then(function(r){

        if(r && r.success) renderSessions(r);

      }).catch(function(){

        countEl.textContent = '读取失败（后端未就绪）';

      });

    }



    refreshBtn.addEventListener('click', loadSessions);

    clearBtn.addEventListener('click', async function(){

      if(!await uiConfirm('确定清空全部通话记录？\n此操作不可撤销。',
          { danger: true, okText: '清空', title: '清空全部通话记录' })) return;

      if(typeof Backend === 'undefined' || !Backend.clearCallRecords) return;

      Backend.clearCallRecords({}).then(function(){ backToList(); }).catch(function(){});

    });

    backBtn.addEventListener('click', backToList);

    exportBtn.addEventListener('click', exportCurrent);



    // 后端广播 call_push → 列表自动刷新（详情页不打扰）

    try{

      var wv = window.chrome && window.chrome.webview;

      if(wv && wv.addEventListener){

        wv.addEventListener('message', function(ev){

          if(ev && ev.data && ev.data.type === 'call_push' && detailEl.hidden) loadSessions();

        });

      }

    }catch(e){}



    loadSessions();

    setInterval(function(){ if(detailEl.hidden) loadSessions(); }, 5000);   // 兜底轮询

  })();

  </script>

</body>

</html>
