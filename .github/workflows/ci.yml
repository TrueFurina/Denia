name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Windows runner 默认控制台编码不是 UTF-8；项目里的中文输出会抛
# UnicodeEncodeError: 'charmap' codec ...（2026-10-28 实测）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: syntax gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: byte-compile (hard gate)
        run: python -m compileall -q src main.py tools
      - name: validate requirements syntax (advisory)
        continue-on-error: true
        run: python tools/check_requirements.py

  self-check:
    name: self-check scripts
    needs: syntax
    runs-on: windows-latest
    env:
      # 需要音频设备 / 桌面会话 / 外设，Windows runner 上没有，跑必红；
      # test_phash.py 需要 imagehash（项目刻意不装，避免拖入 109MB 的 scipy），
      # 它自己在缺依赖时会明确报缺。这些请在真机上跑，不靠 CI 判定。
      SKIP: >-
        test_asr_event_flow.py test_asr_voice_pipeline.py test_dialogue_voice_chain.py
        test_doctor.py test_doctor_asr.py test_doctor_voice_backend.py
        test_doctor_llm_channel.py test_doctor_config_warn.py
        test_autostart.py test_setup_hint.py test_wake_word.py
        test_perception_indicator.py
        test_pet_backend.py test_pet_shell_fallback.py test_pet_shell_selfheal.py
        test_pet_state.py
        test_phash.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML httpx numpy websockets requests rich psutil Pillow mss ollama dashscope pywebview sounddevice
      - name: run every test_*.py as a script
        shell: pwsh
        run: |
          $skip = @($env:SKIP -split '\s+' | Where-Object { $_ })
          $ran = 0; $failed = @()
          foreach ($f in Get-ChildItem src/tests/test_*.py | Sort-Object Name) {
            if ($skip -contains $f.Name) { Write-Host "::group::跳过 $($f.Name)（需音频/桌面）"; Write-Host "::endgroup::"; continue }
            $ran++
            Write-Host "::group::$($f.Name)"
            python $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error file=src/tests/$($f.Name)::自检失败（exit $LASTEXITCODE）"
              $failed += $f.Name
            }
            Write-Host "::endgroup::"
          }
          Write-Host ""
          Write-Host ("执行 {0} 个，通过 {1}，失败 {2}" -f $ran, ($ran - $failed.Count), $failed.Count)
          if ($failed.Count -gt 0) {
            Write-Host ("失败清单: " + ($failed -join ', '))
            # 只打 annotation 不退出码 = 假绿。这里必须让 job 真红。
            exit 1
          }

  pytest:
    name: pytest (standalone modules only)
    needs: syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML httpx numpy websockets requests rich psutil Pillow mss ollama dashscope pywebview sounddevice
      - name: pytest
        run: python -m pytest src/tests -q -p no:cacheprovider
