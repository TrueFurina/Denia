<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8">
<style>
/*==design_tokens.css==*/
/* ============================================================
   达妮娅桌面伴侣 · 设计令牌 v6
   方向：二次元 × 科技感 · 大厂质感
   变更：强调色可主题化（设置页切换渐变）；其余同 v5
   ============================================================ */

:root {
  /* ---- 基底（深色科技） ---- */
  --bg: #0A0C12;
  --bg-2: #0D1018;
  --surface: rgba(255, 255, 255, 0.035);
  --surface-2: rgba(255, 255, 255, 0.06);
  --surface-3: rgba(255, 255, 255, 0.09);
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.16);

  /* ---- 文字 ---- */
  --ink: #E9EDF6;
  --ink-2: #AEB7C9;
  --ink-3: #6C7689;
  --ink-4: #444C5C;

  /* ---- 可主题化强调色（默认 = 极光青紫） ---- */
  --accent-1: #2DD4FF;
  --accent-2: #A06BFF;

  /* 派生（color-mix 自动跟随强调色，换色即同步） */
  --accent-grad: linear-gradient(90deg, var(--accent-1), var(--accent-2));
  --accent-grad-soft: linear-gradient(120deg,
      color-mix(in srgb, var(--accent-1) 18%, transparent),
      color-mix(in srgb, var(--accent-2) 18%, transparent));
  --accent-soft-1: color-mix(in srgb, var(--accent-1) 14%, transparent);
  --accent-soft-2: color-mix(in srgb, var(--accent-2) 16%, transparent);
  --line-strong: color-mix(in srgb, var(--accent-1) 55%, transparent);
  --chara-glow: radial-gradient(circle at 50% 42%,
      color-mix(in srgb, var(--accent-2) 28%, transparent),
      color-mix(in srgb, var(--accent-1) 10%, transparent) 45%, transparent 70%);

  /* 兼容别名（页面仍可用 --cyan / --violet） */
  --cyan: var(--accent-1);
  --violet: var(--accent-2);
  --cyan-soft: var(--accent-soft-1);
  --violet-soft: var(--accent-soft-2);

  /* ---- 补齐「一直在用却从没定义」的变量 ----
     这些名字散落在各页样式里，但本文件从未定义过，var() 只能回退到硬编码值：
       · --surface-1 回退 #161a24 → 角色档案/编辑弹窗、抽屉全是突兀的深色块
         （用户反馈「档案编辑里面配色背景是黑色的」）
       · --accent / --accent-soft 回退空 → 语音回放条、情绪标签、记忆类型签没有底色
     统一接到现有令牌上，从此自动跟随主题色与深浅模式。 */
  --surface-1: var(--bg-2);              /* 弹层 / 抽屉这类「实心面板」底 */
  --accent: var(--accent-1);
  --accent-soft: var(--accent-soft-1);

  /* ---- 补齐第二批「一直在用却从没定义」的变量 ----
     ⚠️ 教训：var(--x, 兜底) 在 --x 未定义时**永远**落在兜底上，若兜底是为深色主题写死的
     浅色文字/深色块，浅色主题下就会出现「文字看不见 / 面板变黑」。 */
  --ink-1: var(--ink);                   /* 文字主色别名。曾漏定义 → 设置页弹窗输入框 var(--ink-1,#E9EDF6)
                                            在浅色主题下变成近白字压在浅底上，不框选完全看不见。
                                            （涉及 settings / voice / lib 三页） */
  --bg-1: var(--bg-2);                   /* 面板底别名。曾漏定义 → 语音档案弹窗 var(--bg-1,#12121c)
                                            在浅色主题下变突兀深色块。 */
  /* 语义色（状态文字/进度条）。原先只有兜底值、无令牌，且各页兜底不一致，这里统一。 */
  --ok: #2faa6a;
  --good: #0f9d6b;
  --warn: #d98a00;
  --bad: #c0392b;
  --err: #ff6363;
  --info: #78c8ff;                       /* 信息色（知识库"世界观"标签等） */
  /* 遮罩 / 蒙层：弹窗、抽屉背后那层。原先各页写死 rgba(0,0,0,.55)，
     浅色主题下会糊成一块脏黑，这里统一成令牌，深浅各一套。 */
  --mask: rgba(4, 7, 14, .55);
  --mask-strong: rgba(6, 9, 15, .62);
  /* 强调色底上的文字（按钮/标签）：全主题统一深色，保证对比度 */
  --on-accent: #06121a;
  /* 开关滑块：深色主题纯白；浅色主题也用白（靠阴影与轨道区分） */
  --knob: #fff;
  /* 装饰性网格线（舞台背景点阵） */
  --grid: rgba(255, 255, 255, .04);
  --mono: var(--font-mono);
  --sans: var(--font);
  --serif: var(--font);

  /* ---- 角色辉光（仅 Live2D 舞台背后） ---- */

  /* ---- 圆角 ---- */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;

  /* ---- 阴影 ---- */
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 8px 24px rgba(0,0,0,.35);
  --shadow-pop: 0 24px 70px rgba(0,0,0,.55);

  /* ---- 字号 ---- */
  --font: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, "Cascadia Code", monospace;
  --fs-xs: 11px;
  --fs-sm: 12.5px;
  --fs-md: 14px;
  --fs-lg: 16px;
  --fs-xl: 20px;
  --fs-2xl: 26px;

  /* ---- 动效 ---- */
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-1: 0.18s;
  --dur-2: 0.32s;
  --dur-3: 0.6s;

  /* ---- 角色图片主题（2026-10-05，由 theme_manager.js 写入）----
     单一真相源：所有页面只消费这几个变量，JS 换图 = 换变量值，
     页面代码一行都不用改。
     未配图时值是 none，各处渲染规则自动回退到原样式（不显示空洞）。 */
  --tm-hero: none;
  --tm-stand: none;
  --tm-avatar: none;
  --tm-cover: none;
  --tm-hero-focus: 50% 30%;
  --tm-stand-focus: 50% 20%;
  --tm-avatar-focus: 50% 50%;
  --tm-cover-focus: 50% 40%;
  /* 页面壁纸逐页（默认全 none = 不生效） */
  --tm-wall-daily: none;
  --tm-wall-memory: none;
  --tm-wall-settings: none;
  --tm-wall-voice: none;
  --tm-wall-lib: none;
  --tm-wall-chat: none;
}

/* ============ 图位实际渲染 ============
   hero：整个 app 背后的大图（通栏）。放在 ::before 上并用 z-index:-1，
   避免遮挡内容；配了图时压一层暗色蒙版保证文字可读。 */
body.has-hero::before {
  background-image: var(--tm-hero);
  background-size: cover;
  background-position: var(--tm-hero-focus);
  opacity: 1;
}
body.has-hero::after { opacity: 1; }
body.has-hero .app,
body.has-hero .side,
body.has-hero .main,
body.has-hero .stage { position: relative; z-index: 1; }

/* 页面壁纸：仅当该页被指定壁纸时，用 body 的多重背景最上层放它 */
body[data-tm-pages="on"]::before {
  background-image: var(--tm-wall-daily);
  background-size: cover;
  background-position: center;
}

/* stand：Live2D 舞台背后的角色立绘 */
.stage.has-stand .panel { position: relative; overflow: hidden; }
.stage.has-stand .panel::before {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background-image: var(--tm-stand);
  background-size: cover;
  background-position: var(--tm-stand-focus);
  pointer-events: none;
}
.stage.has-stand .panel > * { position: relative; z-index: 1; }
/* 立绘铺上舞台后，LIVE2D 占位（.placeholder 的圆环 + 提示）必须让位：
   否则立绘图和占位环叠在一起，看起来像「两个模型」同时挂着（用户反馈的 bug）。 */
.stage.has-stand .panel .placeholder { display: none; }

/* avatar：全局头像（侧栏/聊天卡/桌宠气泡/角色配置卡）
   ⚠️ 选择器名必须与真实 DOM 对齐：角色页角色卡里的头像容器 class 是 .cav
   （见 ui_redesign_characters.html 的 avatarHtml），聊天页是 .av。
   写错类名 ⇒ 规则永不命中 ⇒ 图配了但看不见（静默失效）。 */
.av.has-img, .cav.has-img {
  background-image: var(--tm-avatar);
  background-size: cover;
  background-position: var(--tm-avatar-focus);
  /* 🔴 2026-10-06：配了头像图就别再把「名字占位」压在图上。
     .cav 早就有 `> * {display:none}`，但聊天头像 .av 的占位是**文本节点**（不是元素），
     元素选择器管不到 ⇒ 一直是「头像图 + 一个大字叠着」（用户报的 bug）。
     这里统一：图在 = 文字透明 + 占位元素隐藏。 */
  color: transparent;
}
.av.has-img > .ph-av, .cav.has-img > .ph-av { display: none; }

/* ⭐ 「我」的头像永远不套角色主题图 —— 否则用户和角色用同一张图、完全分不清谁是谁
   （2026-10-06 用户实测反馈）。人形占位始终保留，和角色头像形成明确区分。 */
.av.me, .av.me.has-img{
  background-image: none !important;
  background-color: var(--surface-3);
  color: var(--ink-2);
}
.av.me > .ph-av{ display: grid !important; }

/* ============ 无头像占位：中性圆 + 人形剪影（抖音式） ============
   以前没配头像就画「姓名首字」，既丑又把名字糊在框里；现在统一成通用人形占位。
   用法：<div class="av"><span class="ph-av"><i><svg…/></i></span></div> */
.ph-av { width: 100%; height: 100%; display: grid; place-items: center; }
.ph-av > i {
  width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--ink-3) 26%, var(--surface-3));
}
.ph-av svg { width: 56%; height: 56%; display: block; color: color-mix(in srgb, var(--bg) 94%, transparent); }
/* 侧栏品牌（左上角）：不要把头像整块铺满（方形脸图裁到矮宽条上只剩一条眼睛，
   且子页侧栏跟着铺图后看起来「又长出一个主页」）。改成左侧一个小圆角头像 +
   品牌文字，跟随主题变化但不抢戏。 */
/* ⚠️ 必须是 grid 而不是 flex-row：.brand 的子节点是 .wm + .wmsub 两个【平级】div，
   flex 行会把「达妮娅」和「DESKTOP COMPANION」并排塞进 ~160px，两个都被挤到换行
   （实测「达妮/娅」「DESKTOP/COMPANION」四行，像排版坏了）。grid 让 .wm/.wmsub 上下叠。 */
.side .brand.has-img {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr);
  column-gap: 10px; row-gap: 2px;
  align-items: center;
}
.side .brand.has-img .wm { grid-column: 2; grid-row: 1; min-width: 0; }
.side .brand.has-img .wmsub { grid-column: 2; grid-row: 2; min-width: 0; }
.side .brand.has-img::before {
  content: ""; grid-column: 1; grid-row: 1 / span 2; width: 36px; height: 36px; border-radius: 11px;
  background-image: var(--tm-avatar);
  background-size: cover;
  background-position: var(--tm-avatar-focus);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--line-2) 55%, transparent),
              0 2px 8px rgba(0, 0, 0, .14);
}
/* 角色卡里 .cav 原本是渐变底 + 首字母，铺上头像图后要盖住那层渐变 */
.cav.has-img { background-image: var(--tm-avatar); color: transparent; }
.cav.has-img > * { display: none; }

/* cover：角色卡【整卡】背景（角色页 .ccard）
   ⭐ 用户裁决（2026-10-05）：角色卡头图应该是「整个卡片的背景」，不是卡内那一小条。
      故 .cbanner（卡内通栏 / 出血小条）方案作废，统一走 .ccard 整卡铺图。
   ⚠️ 遮罩必须是【自上而下的渐变】而不是一层平铺的白：
      原写法是两个 72%/82% 的近色停靠 ⇒ 等于糊了一层 77% 的板，图几乎看不见，
      看起来就跟「没生效」一样。现在改成顶部 30%（露图）→ 底部 88%（压住文字），
      既看得出是整卡背景，又保证 .cdesc / .cmeta / 按钮上的字读得清。 */
.ccard.has-cover, .char-card.has-cover {
  background-image:
    linear-gradient(to bottom,
      color-mix(in srgb, var(--bg) 30%, transparent) 0%,
      color-mix(in srgb, var(--bg) 62%, transparent) 38%,
      color-mix(in srgb, var(--bg) 84%, transparent) 72%,
      color-mix(in srgb, var(--bg) 90%, transparent) 100%),
    var(--tm-cover);
  background-size: cover, cover;
  background-position: center, var(--tm-cover-focus);
  background-repeat: no-repeat, no-repeat;
  /* 图被 padding 区裁掉一角会露白边，强制贴到边框内沿 */
  background-clip: border-box, border-box;
}
/* 整卡背景铺上后，卡内文字要有一点自己的衬底才不至于糊在图里 */
.ccard.has-cover .cdesc, .char-card.has-cover .cdesc {
  text-shadow: 0 1px 2px color-mix(in srgb, var(--bg) 70%, transparent);
}

/* ============ 主题色预设（设置页切换） ============ */
[data-accent="aurora"] { --accent-1:#2DD4FF; --accent-2:#A06BFF; }  /* 极光（默认） */
[data-accent="neon"]   { --accent-1:#FF5FA2; --accent-2:#A855F7; }  /* 霓虹粉紫 */
[data-accent="mint"]   { --accent-1:#22D3A6; --accent-2:#38BDF8; }  /* 森绿青 */
[data-accent="lava"]   { --accent-1:#FF8A3D; --accent-2:#FF4D6D; }  /* 熔岩橙红 */
[data-accent="abyss"]  { --accent-1:#5B8CFF; --accent-2:#22D3EE; }  /* 星海蓝青 */

/* ============ 深浅模式（跟随系统 / 强制浅色 / 强制深色） ============
   :root 里的默认是深色。JS（app_backend.js 的 Theme）会在首屏前按用户选择
   明确写出 data-theme="light" 或 "dark"，下面 [data-theme] 规则优先级最高。
   ① 媒体查询那份：给「跟随系统」且 JS 尚未接管时的首屏使用（:not 排除强制深色）。
   ② [data-theme="light"] 那份：系统是深色、用户却选了浅色时必须靠它亮起来。
   ⚠️ 浅色调色板有两份，改配色时这两处要同步。 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F4F6FA;
    --bg-2: #EAEEF5;
    --surface: rgba(15, 22, 40, 0.025);
    --surface-2: rgba(15, 22, 40, 0.05);
    --surface-3: rgba(15, 22, 40, 0.08);
    --line: rgba(15, 22, 40, 0.10);
    --line-2: rgba(15, 22, 40, 0.18);
    --ink: #141B2B;
    --ink-2: #4A5468;
    --ink-3: #828DA3;
    --ink-4: #B3BccB;
    --shadow-1: 0 1px 2px rgba(20,30,60,.08);
    --shadow-2: 0 8px 24px rgba(20,30,60,.10);
    --shadow-pop: 0 24px 70px rgba(20,30,60,.18);
    /* 与深色版同一批语义令牌的浅色取值（改配色时两处必须同步） */
    --info: #1d6fa5;
    --mask: rgba(20, 30, 60, .32);
    --mask-strong: rgba(20, 30, 60, .42);
    --on-accent: #06121a;
    --knob: #fff;
    --grid: rgba(15, 22, 40, .05);
  }
}
/* 强制浅色（系统深色时也要亮） */
:root[data-theme="light"] {
  --bg: #F4F6FA;
  --bg-2: #EAEEF5;
  --surface: rgba(15, 22, 40, 0.025);
  --surface-2: rgba(15, 22, 40, 0.05);
  --surface-3: rgba(15, 22, 40, 0.08);
  --line: rgba(15, 22, 40, 0.10);
  --line-2: rgba(15, 22, 40, 0.18);
  --ink: #141B2B;
  --ink-2: #4A5468;
  --ink-3: #828DA3;
  --ink-4: #B3BccB;
  --shadow-1: 0 1px 2px rgba(20,30,60,.08);
  --shadow-2: 0 8px 24px rgba(20,30,60,.10);
  --shadow-pop: 0 24px 70px rgba(20,30,60,.18);
  /* 与媒体查询那份完全一致的浅色取值（系统是深色、用户选浅色时靠这一份） */
  --info: #1d6fa5;
  --mask: rgba(20, 30, 60, .32);
  --mask-strong: rgba(20, 30, 60, .42);
  --on-accent: #06121a;
  --knob: #fff;
  --grid: rgba(15, 22, 40, .05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); color: var(--ink); background: var(--bg);
  font-size: var(--fs-md); line-height: 1.6; -webkit-font-smoothing: antialiased;
  overflow: auto; position: relative;
  display: grid; place-items: center; padding: 20px; min-height: 100vh;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(circle at 50% 40%, #000 30%, transparent 85%);
}
body::after {
  content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(40% 38% at 22% 28%, color-mix(in srgb, var(--accent-1) 10%, transparent), transparent 60%),
    radial-gradient(42% 40% at 80% 72%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 62%);
  filter: blur(20px);
  animation: drift 26s var(--ease) infinite alternate;
}
@keyframes drift {
  0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
  100% { transform: translate3d(3%, 2%, 0) scale(1.08); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  body::after { animation: none; }
}

a.nav{ text-decoration: none; }

/* 状态徽标（主页运行状态 / 设置页通用） */
.badge{ font-family: var(--font-mono); font-size: 11px; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.badge.on{ color: var(--accent-1); background: var(--accent-soft-1); }
.badge.off{ color: var(--ink-3); background: transparent; border: 1px solid var(--line); }

/*==ui_shared.css==*/
/* ============================================================
   ui_shared.css · 通用组件样式 v8
   与 ui_redesign_main.html 视觉语言一致（二次元 × 科技感）
   依赖 design_tokens.css；用于角色 / 日报周报 / 开发者 / 设置 页
   ============================================================ */

/* 三栏应用骨架（侧栏 + 内容 + 右侧舞台）：主页/知识库/所有子页共用。
   home.css 只微调尺寸（--side-w/--stage-w 具体像素值），不再定义网格结构。 */
.app{
  --side-w: 236px; --stage-w: 320px;
  position: relative; z-index: 1;
  width: min(1080px, 100%); min-width: 860px;
  height: min(740px, 94vh); min-height: 580px;
  display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) var(--stage-w);
  background: linear-gradient(180deg, var(--bg-2), var(--bg));
  border: 1px solid var(--line); border-radius: var(--r-xl);
  box-shadow: var(--shadow-pop); overflow: hidden;
}

/* ⭐ 主题背景（hero）已配时：三栏骨架变「玻璃」，让 body::before 上的大图透出来。
   🔴 2026-10-06 改版：原来是**整窗一个透明度**（.app 一律 56% + 2px 模糊），
      结果文字密度最大的侧栏/气泡也跟着透 ⇒ 字发虚、整片糊成一块
      （用户原话："透明度不应该全局一个值，搞得字有点看不清还感觉整体有点丑"）。
   现在按「文字密度」分区给不同不透明度：
      侧栏最实（导航全是字）＞ 顶栏/输入栏 ＞ 右侧舞台 ＞ 中间对话区最透（壁纸主要露在这）。
   外壳 .app 自己透明且**不带 backdrop-filter** —— 带 filter/backdrop-filter 会把自己
   变成 backdrop root，子元素的 backdrop-filter 就只看得到 .app 内部、磨不到背后的大图。
   仅 body.has-hero 下生效；没配背景时保持原不透明外观。 */
body.has-hero .app{
  background: transparent;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
/* 🔴 2026-10-06 性能修复：这里原来给 .side/.top/.stage 挂了 blur(12~14px) 的
   backdrop-filter。但 design_tokens.css 的 `body::after`（全屏 fixed 层）带
   `filter: blur(20px)` + **无限 drift 动画**，backdrop 每帧都在变 ⇒ Chromium
   每帧都要重算这几块大面积的模糊 ⇒ 整个界面被拖慢（用户报「换角色后消息回复
   巨慢」：切到达妮娅那套带 hero 的主题才第一次打开 has-hero，玻璃才开始生效）。
   现在去掉模糊、只留半透明底色（观感几乎不变，渲染代价归零）。 */
body.has-hero .side{
  background: color-mix(in srgb, var(--bg) 90%, transparent);
}
body.has-hero .main{
  background: color-mix(in srgb, var(--bg) 68%, transparent);
}
body.has-hero .main > .top,
body.has-hero .main > .composer{
  background: color-mix(in srgb, var(--bg) 86%, transparent);
}
body.has-hero .stage{
  background: color-mix(in srgb, var(--bg) 80%, transparent);
}
/* 对话区最透 ⇒ 气泡/卡片必须有自己的实底，否则字糊在壁纸上。
   ⚠️ 只作用于 .main 内：.stage .card 是被刻意「去卡片化」的（透明无框），
   不能因为全局 .card 规则把它的底又画回来。 */
body.has-hero .main .bub{
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-color: color-mix(in srgb, var(--line-2) 70%, transparent);
}
body.has-hero .main .row.me .bub{
  background: color-mix(in srgb, var(--accent-1) 12%, color-mix(in srgb, var(--bg) 84%, transparent));
  border-color: color-mix(in srgb, var(--accent-1) 38%, transparent);
}
body.has-hero .main .card{
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  border-color: color-mix(in srgb, var(--line) 80%, transparent);
}

/* 子页（知识库 / 教学）可声明 <meta name="stage" content="off">，spa.js 切栏时给外壳
   .app 加 .no-stage 隐藏右栏；每次切栏都重置，杜绝子页 <style> 泄漏到常驻外壳导致
   「点知识库后对话页右栏也被隐藏」的串味问题。对话页(首页)永远显示右栏。 */
.app.no-stage{ grid-template-columns: var(--side-w) minmax(0, 1fr); }
.app.no-stage .stage{ display: none; }

/* ===== 切栏入场动画 =====
   只要右侧内容区是新插入的节点就会自动重播：首屏加载会播，SPA 切栏
   （oldMain.replaceWith(newMain)）后同样会播。
   走纯 CSS 是为了不依赖各页内联脚本有没有被重新执行 —— 之前「非对话页之间
   切栏不重播入场动画」正是因为各页的 gsap.from 只覆盖静态节点、且与异步
   渲染的数据赛跑（内容后到就完全没动画）。 */
@keyframes pageEnter{
  from{ opacity: 0; transform: translateY(10px); }
  to{ opacity: 1; transform: none; }
}
.app > .main{ animation: pageEnter .42s var(--ease) both; }
@media (prefers-reduced-motion: reduce){ .app > .main{ animation: none; } }

/* ===== 交互特效（配套 app_backend.js 的 window.Fx） =====
   颜色全部走 --accent-1 / --accent-2，自动跟随用户在设置页选的主题色。 */

/* 水波纹：从点击点扩散的柔和高光环，边缘羽化、会消散
   —— 刻意不用实心硬边的墨点，避免 Material 那股老土感 */
.fx-wave{
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
  transform: translate(-50%, -50%) scale(0);
  background: radial-gradient(circle closest-side,
    color-mix(in srgb, var(--accent-1) 24%, transparent) 0%,
    color-mix(in srgb, var(--accent-1) 13%, transparent) 32%,
    color-mix(in srgb, var(--accent-1) 30%, transparent) 55%,
    color-mix(in srgb, var(--accent-2) 15%, transparent) 72%,
    transparent 88%);
  animation: fxWave .62s var(--ease-out) forwards;
}
@keyframes fxWave{
  0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  14%  { opacity: .9; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce){ .fx-wave{ display: none; } }

/* 横向紧挨的小卡片（.tabs / .seg）：选中背景块横向位移过去 */
.fx-seg{ position: relative; }
.fx-seg > button{ position: relative; z-index: 1; }
.fx-seg-pill{
  position: absolute; left: 0; top: 0; width: 0; height: 0;
  border-radius: var(--r-sm); pointer-events: none; opacity: 0;
  background: linear-gradient(120deg,
    color-mix(in srgb, var(--accent-1) 26%, transparent),
    color-mix(in srgb, var(--accent-2) 22%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-1) 40%, transparent);
  transition: transform .34s var(--ease), width .34s var(--ease),
              height .34s var(--ease), opacity .18s linear;
}
@media (prefers-reduced-motion: reduce){ .fx-seg-pill{ transition: none; } }
/* 底色交给位移块，按钮自身不再铺底
   （选择器写两遍 .fx-seg 提高优先级，才能压过各页的 .tab.on / .seg button.on） */
.fx-seg.fx-seg > button.on{ background: transparent; color: var(--accent-1); }

/* ============ 侧边栏 ============ */
.side{ background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 22px 14px; }
.brand{ padding: 2px 8px 22px; }
.brand .wm{ font-size: 17px; font-weight: 700; letter-spacing: .04em; }

.nav{ display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 11px; border: none; cursor: pointer;
  background: transparent; color: var(--ink-2); text-align: left; border-radius: var(--r-md); position: relative;

.nav.on::before{ content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 99px; background: var(--accent-grad); box-shadow: 0 0 10px var(--accent-1); }

.mini{ flex: 1; display: flex; align-items: center; gap: 7px; justify-content: center; padding: 7px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink-2); cursor: pointer; font-size: var(--fs-xs); text-decoration: none; transition: border-color var(--dur-1), color var(--dur-1); }
.mini:hover{ border-color: var(--line-strong); color: var(--accent-1); }

/* ============ 主内容区 ============ */
.main{ display: flex; flex-direction: column; min-width: 0; min-height: 0; }

.icon-btn:hover{ border-color: var(--line-strong); color: var(--accent-1); }

/* ============ 卡片 / 状态行 ============ */

.switch{ position: relative; width: 42px; height: 24px; flex: none; border: none; cursor: pointer; border-radius: 99px; background: var(--surface-3); transition: background var(--dur-2) var(--ease); }
.switch i{ position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink-2); transition: transform var(--dur-2) var(--ease), background var(--dur-2); }
.switch.on{ background: var(--accent-grad); }

/* ============ 按钮 ============ */
.btn{ display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-size: var(--fs-sm); transition: border-color var(--dur-1), color var(--dur-1), background var(--dur-1); }

.modal{ position: fixed; inset: 0; z-index: 50; display: none; }
.modal.open{ display: block; }
.modal-mask{ position: absolute; inset: 0; background: var(--mask); backdrop-filter: blur(3px); }
.modal-card{ position: absolute; left: 50%; top: 50%; width: min(440px, 92vw); max-height: 88vh; transform: translate(-50%,-50%); display: flex; flex-direction: column; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); overflow: hidden; }

/* 条形律动（loadbar 类）：子元素按顺序错峰起伏，像音频电平在跳 */
.dicon-bars > *{ animation: diconBar .9s ease-in-out infinite; transform-origin: center; }
.dicon-bars > *:nth-child(2){ animation-delay: .15s; }

.dicon-bars > *:nth-child(4){ animation-delay: .45s; }
@keyframes diconBar{ 0%,100%{ transform: scaleY(.45); opacity: .55; } 50%{ transform: scaleY(1); opacity: 1; } }

  /* ============ 消息入场动画 + 流式输出适配（2026-09-30 重做） ============
     观感目标：像对话被"从两侧推入"——达妮娅的从左滑入、我发的从右滑入，
     带一点轻微纵深（scale + 微模糊 → 清晰），收尾用 expo-out 曲线（起步快、
     尾巴长），是常见的"高级感"入场曲线，比线性/匀速更显顺滑。
     纯 CSS，无 gsap 依赖（gsap 偶发未加载会把元素卡在 opacity:0 的透明态）。
     ① 行：从侧面推入 + 微微上浮；② 气泡本体稍晚 60ms 起、带极轻的回弹，
        形成"头像先到、气泡跟上"的层次；③ 头像独立淡入，避免整块一起闪。 */
  @keyframes rowInAi{
    from{ opacity: 0; transform: translate3d(-30px, 10px, 0) scale(.972); filter: blur(4px); }
    55% { opacity: 1; }
    to  { opacity: 1; transform: none; filter: none; }
  }
  @keyframes rowInMe{
    from{ opacity: 0; transform: translate3d(30px, 10px, 0) scale(.972); filter: blur(4px); }
    55% { opacity: 1; }
    to  { opacity: 1; transform: none; filter: none; }
  }
  @keyframes bubIn{
    from{ opacity: 0; transform: scale(.90); }
    to  { opacity: 1; transform: scale(1); }
  }
  @keyframes avIn{
    from{ opacity: 0; transform: scale(.7); }
    to  { opacity: 1; transform: scale(1); }
  }
  .row.row-in{
    animation: rowInAi .58s cubic-bezier(.16, 1, .3, 1) both;
    will-change: transform, opacity, filter;
  }
  .row.me.row-in{ animation-name: rowInMe; }
  .row.row-in .bub{
    animation: bubIn .44s cubic-bezier(.34, 1.42, .64, 1) .06s both;
    transform-origin: left bottom;
  }
  .row.me.row-in .bub{ transform-origin: right bottom; }
  .row.row-in .av{ animation: avIn .34s cubic-bezier(.16, 1, .3, 1) both; }
  /* 流式：文本逐句追加时 height 由 JS 显式过渡（见 app_backend.js upsertRow），
     气泡高度平滑增长不跳动；流式期间尾随一个闪烁光标表示"还在说"。 */
  .bub .caret{ display: inline-block; width: 2px; height: 1em; margin-left: 3px; vertical-align: -2px;
    background: var(--accent-1); border-radius: 1px;
    animation: caretBlink 1s steps(2, start) infinite; }
  @keyframes caretBlink{ 0%,100%{ opacity: 1; } 50%{ opacity: 0; } }
  @media (prefers-reduced-motion: reduce){
    .row.row-in, .row.row-in .bub, .row.row-in .av, .bub .caret{ animation: none; }
  }

  .composer{ padding: 10px 24px 14px; border-top: 1px solid var(--line); position: relative; }
  .composer::before{ content: ""; position: absolute; left: 24px; right: 24px; top: -1px; height: 1px; background: var(--accent-grad); opacity: .5; }
  .field{ position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 12px; border: 1px solid var(--line);
    border-radius: var(--r-md); background: var(--surface); transition: border-color var(--dur-1), box-shadow var(--dur-1); }
  .field:focus-within{ border-color: var(--line-strong); box-shadow: 0 0 0 3px var(--accent-soft-1); }
  .field textarea{ flex: 1; resize: none; border: none; background: transparent; color: var(--ink);
    font-family: var(--font); font-size: var(--fs-md); line-height: 22px; height: 22px; min-height: 22px;
    max-height: 120px; outline: none; padding: 0; }
  .field textarea::placeholder{ color: var(--ink-3); }
  .send{ position: relative; overflow: hidden; width: 32px; height: 32px; flex: none; border: none; cursor: pointer;
    border-radius: 9px; background: var(--accent-grad); color: var(--on-accent); display: grid; place-items: center;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--accent-1) 30%, transparent); transition: transform var(--dur-1) var(--ease); }
  .send:hover{ transform: translateY(-1px); }
  .send svg{ width: 18px; height: 18px; stroke-width: 2; }
  .ripple{ position: absolute; border-radius: 50%; background: rgba(255,255,255,.5); transform: translate(-50%,-50%) scale(0);
    animation: rip .6s var(--ease) forwards; pointer-events: none; }
  @keyframes rip{ to{ transform: translate(-50%,-50%) scale(9); opacity: 0; } }

  /* ============ 右侧舞台（Live2D 缩小 + 消耗面板） ============ */
  .stage{ border-left: 1px solid var(--line); background: var(--surface);
    display: flex; flex-direction: column; gap: 14px; padding: 18px 16px;
    overflow-y: auto; min-height: 0; }
  .stage::-webkit-scrollbar{ width: 8px; }
  .stage::-webkit-scrollbar-thumb{ background: var(--line-2); border-radius: 99px; }
  .stage::-webkit-scrollbar-track{ background: transparent; }
  .panel{ position: relative; height: 250px; border: 1px solid var(--line-2); border-radius: var(--r-lg);
    background: var(--surface); overflow: hidden; display: grid; place-items: center; }
  .panel::before{ content: ""; position: absolute; inset: 0; background: var(--chara-glow); opacity: .9; }
  .panel .grid{ position: absolute; inset: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 26px 26px; mask-image: radial-gradient(circle at 50% 45%, #000, transparent 75%); }
  .panel .tick{ position: absolute; width: 14px; height: 14px; border: 2px solid var(--accent-1); opacity: .7; }
  .panel .tick.tl{ top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .panel .tick.tr{ top: 10px; right: 10px; border-left: none; border-bottom: none; }
  .panel .tick.bl{ bottom: 10px; left: 10px; border-right: none; border-top: none; }
  .panel .tick.br{ bottom: 10px; right: 10px; border-left: none; border-top: none; }
  /* 【2026-10-06】主题编辑器聚焦时，这四个取景角标必须让位。
     它们是**产品主页**的取景装饰（固定 10px 内缩），而编辑器会在目标部位上
     画自己的高亮描边 —— 两者叠在一起，就是用户报的「四个角标错位」：
     一半是编辑器的描边、一半是这四个 tick，视觉上像两组框对不上。
     编辑器聚焦时藏掉 tick，回全局（无 focus）时恢复。 */
  body.te-editing .panel .tick{ opacity: 0; }
  .placeholder{ position: relative; z-index: 1; text-align: center; color: var(--ink-3); }
  .placeholder .ring{ width: 96px; height: 96px; margin: 0 auto 12px; border-radius: 50%;
    border: 1px dashed var(--line-2); display: grid; place-items: center; font-family: var(--font-mono);
    font-size: 10px; letter-spacing: .1em; background: var(--accent-grad-soft); animation: floaty 5s var(--ease) infinite; }
  @keyframes floaty{ 50%{ transform: translateY(-6px); } }
  .placeholder .hint{ font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; }

  .nameplate{ display: flex; align-items: center; justify-content: space-between;
    padding: 0; border: none; background: transparent; }
  .nameplate .nm{ font-size: 15px; font-weight: 650; }
  .nameplate .st{ font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; color: var(--accent-1); margin-top: 2px; }
  .readouts{ display: flex; gap: 8px; }
  .ro{ font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; color: var(--ink-2);
    padding: 0; border: none; border-radius: 0; background: transparent; }
  .ro b{ color: var(--accent-1); font-weight: 600; }
  /* 状态/消耗面板去卡片化：改为纯小字（用户要求不要框框框起来） */
  .stage .card{ border: none; background: transparent; padding: 0; box-shadow: none; }
  .stage .card .ct{ margin-bottom: 8px; }
  .stage .badge{ border: none; background: transparent; padding: 0; }
  .stage .badge.on{ background: transparent; color: var(--accent-1); }
  .stage .modebtn{ background: var(--surface-2); }

  .card{ border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 13px 14px; }
  .card .ct{ font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 10px; }
  .crow{ display: flex; align-items: center; justify-content: space-between; padding: 5px 0; }
  .crow + .crow{ border-top: 1px solid var(--line); }
  .crow span{ font-size: var(--fs-sm); color: var(--ink-2); }
  .crow b{ font-family: var(--font-mono); font-size: 14px; color: var(--ink); font-weight: 600; }
  .crow b em{ font-style: normal; font-size: 10px; color: var(--ink-3); margin-left: 2px; }

  .status .srow{ display: flex; align-items: center; justify-content: space-between; padding: 5px 0; }
  .status .srow + .srow{ border-top: 1px solid var(--line); }
  .status .srow span{ font-size: var(--fs-sm); color: var(--ink-2); }
  .status .srow b{ font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; }
  .status .on{ color: var(--accent-1); }
  .status .off{ color: var(--ink-3); }

  /* ============ 运行状态 · 引擎模式 / 开关 / 弹窗 ============ */
  .status .modebtn{ width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 11px; margin-bottom: 4px; cursor: pointer; text-align: left;
    border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2);
    color: var(--ink); transition: border-color var(--dur-1), background var(--dur-1); }
  .status .modebtn:hover{ border-color: var(--line-strong); background: var(--surface-3); }
  .status .mb-left{ display: flex; flex-direction: column; gap: 2px; }
  .status .mb-k{ font-size: var(--fs-sm); font-weight: 600; }
  .status .mb-sub{ font-family: var(--font-mono); font-size: 9px; letter-spacing: .05em; color: var(--ink-3); }
  .status .chev{ font-size: 18px; color: var(--ink-3); line-height: 1; transition: transform var(--dur-1); }
  .status .modebtn:hover .chev{ transform: translateX(2px); color: var(--accent-1); }
  .status .engines{ border-top: 1px solid var(--line); padding-top: 4px; }
  .status .erow{ display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; }
  .status .erow + .erow{ border-top: 1px dashed var(--line); }
  .status .erow span{ font-size: var(--fs-sm); color: var(--ink-2); }
  .status .erow b{ font-family: var(--font-mono); font-size: 11px; letter-spacing: .03em; color: var(--accent-1); }

  .status .toggle-row{ align-items: flex-start; }
  .status .tl{ display: flex; flex-direction: column; gap: 2px; }
  .status .tl .hint{ font-family: var(--font-mono); font-size: 9px; letter-spacing: .03em; color: var(--ink-3); }
  .switch{ position: relative; width: 42px; height: 24px; flex: none; border: none; cursor: pointer;
    border-radius: 99px; background: var(--surface-3); transition: background var(--dur-2) var(--ease); }
  .switch i{ position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--ink-2); transition: transform var(--dur-2) var(--ease), background var(--dur-2); }
  .switch.on{ background: var(--accent-grad); }
  .switch.on i{ transform: translateX(18px); background: var(--knob); }

  /* ---- 弹窗 ---- */
  .modal{ position: fixed; inset: 0; z-index: 50; display: none; }
  .modal.open{ display: block; }
  .modal-mask{ position: absolute; inset: 0; background: var(--mask); backdrop-filter: blur(3px); }
  .modal-card{ position: absolute; left: 50%; top: 50%; width: min(420px, 92vw); max-height: 88vh;
    transform: translate(-50%,-50%); display: flex; flex-direction: column;
    background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r-lg);
    box-shadow: var(--shadow-pop); overflow: hidden; }
  .modal-head{ display: flex; align-items: center; justify-content: space-between; padding: 16px 18px;
    border-bottom: 1px solid var(--line); font-size: var(--fs-lg); font-weight: 650; }
  .modal-head .x{ width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    color: var(--ink-2); cursor: pointer; font-size: 12px; }
  .modal-head .x:hover{ border-color: var(--line-strong); color: var(--ink); }
  .modal-body{ padding: 14px 18px; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; overflow-y: auto; }
  .modal-body::-webkit-scrollbar{ width: 8px; } .modal-body::-webkit-scrollbar-thumb{ background: var(--line-2); border-radius: 99px; }
  .msec-t{ font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .opt{ display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); cursor: pointer;
    transition: border-color var(--dur-1), background var(--dur-1); }
  .opt:last-child{ margin-bottom: 0; }
  .opt:hover{ border-color: var(--line-strong); }
  .opt.sel{ border-color: var(--accent-1); background: var(--accent-soft-1); }
  .opt.dev{ opacity: .42; cursor: not-allowed; }
  .opt.dev:hover{ border-color: var(--line); }
  .opt b{ font-size: var(--fs-md); font-weight: 600; }
  .opt .sub{ display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: .03em; color: var(--ink-3); margin-top: 2px; }
  .opt .pick{ width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2px solid var(--line-2); }
  .opt.sel .pick{ border-color: var(--accent-1); background: var(--accent-1); box-shadow: inset 0 0 0 3px var(--bg-2); }
  .modal-foot{ display: flex; justify-content: flex-end; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .modal-foot button{ padding: 9px 18px; border-radius: 10px; cursor: pointer; font-size: var(--fs-sm); border: 1px solid var(--line); }
  .modal-foot .ghost{ background: var(--surface); color: var(--ink-2); }
  .modal-foot .ghost:hover{ color: var(--ink); border-color: var(--line-strong); }
  .modal-foot .primary{ background: var(--accent-grad); color: var(--on-accent); border-color: transparent; font-weight: 600; }
  .modal-foot .primary:hover{ filter: brightness(1.08); }

/* ===== 聊天页：Live2D 舞台 / 头部控件 / 空状态 ===== */
.stage .panel{ position: relative; overflow: hidden; }
.live2d-frame{ position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 18px; background: transparent; }
.ctl{ width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; transition: all .15s ease; }
.ctl:hover{ border-color: var(--accent-2); color: var(--accent-2); }
.ctl.on{ background: var(--accent-soft-1); border-color: var(--accent-1); color: var(--accent-1); }
.ctl svg{ width: 18px; height: 18px; display: block; transform-origin: center; }
/* 麦克风：关闭态显示斜杠，开启态高亮 + 脉冲点，状态一目了然 */
.ctl.mic:not(.on){ color: var(--ink-3); }
.ctl.mic.on{ position: relative; background: var(--accent-soft-1); border-color: var(--accent-1); color: var(--accent-1); box-shadow: 0 0 0 3px var(--accent-soft-1); }
.ctl.mic.on::after{ content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent-1); box-shadow: 0 0 0 0 var(--accent-1);
  animation: micPulse 1.6s var(--ease) infinite; }
@keyframes micPulse{ 0%{ box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent-1) 60%, transparent); }
  70%{ box-shadow: 0 0 0 7px transparent; } 100%{ box-shadow: 0 0 0 0 transparent; } }
/* 持续语音：开启态同样高亮 */
.ctl.on{ color: var(--accent-1); }
@media (prefers-reduced-motion: reduce){ .ctl.mic.on::after{ animation: none; } }
.empty{ display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 40px 20px; color: var(--ink-3); text-align: center; }
.empty-face{ font-size: 42px; line-height: 1; }
.empty-tip{ font-size: var(--fs-sm); }

/* ===== 对话页：音频回放 / 情绪标签 / 记忆库抽屉 / 专注模式 ===== */
.msg-audio{ display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); max-width: 280px; }
.audio-play{ width: 26px; height: 26px; border-radius: 50%; border: none; background: var(--accent-soft); color: var(--accent); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.audio-track{ flex: 1; height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.audio-fill{ height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
.audio-time{ font-size: 11px; color: var(--ink-3); flex: none; }
.msg-mood{ display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; font-size: 11px; color: var(--accent-2); background: var(--accent-soft); vertical-align: middle; }
.drawer{ position: fixed; inset: 0; z-index: 9998; display: none; align-items: flex-end; justify-content: flex-end; background: var(--mask); backdrop-filter: blur(3px); }
.drawer.show{ display: flex; }
.drawer-card{ width: min(380px, 92vw); max-height: 80vh; margin: 16px; display: flex; flex-direction: column; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.4); overflow: hidden; }
.drawer-head{ display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer-title{ font-weight: 700; font-size: 15px; }
.drawer-x{ background: none; border: none; color: var(--ink-3); font-size: 17px; cursor: pointer; }
.drawer-body{ padding: 12px 16px; overflow: auto; }
.mem-row{ display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.mem-type{ flex: none; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-2); }
.mem-type.type-directive{ background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.mem-type.type-world{ background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
.mem-text{ font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.5; }
/* ===== 专注模式（纯净模式）=====
   左栏向左、右舞台向右「一点点挪到画面外」：轨道宽度 --side-w / --stage-w 与
   位移由 GSAP 用同一条线性时间轴驱动（ease:'none'），中间对话区同步铺满，
   头部按钮随布局平滑平移到新的右端，不再瞬移。 */
body.focus .side,
body.focus .stage{ pointer-events: none; }
/* 降级：无 gsap / 系统开启「减少动态效果」时，退回原来的直接隐藏 */
body.focus-static .side,
body.focus-static .stage{ display: none; }
body.focus-static .app{ grid-template-columns: minmax(0, 1fr); }

/* 二级页（设置/语音/日报/角色/开发者）组件样式，全局链接 */

/* ===== ui_redesign_settings.html ===== */
.group{ border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .group .gt{ font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }

  .seg button.on{ background: var(--accent-soft-1); color: var(--accent-1); font-weight: 600; }
  .range-row{ display: flex; align-items: center; gap: 14px; }

  /* ---- 档位内分组导航（粘性 · 吸顶后整条遮挡内容） ---- */

  .settings-inner{ padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 18px; }

    box-shadow: 0 12px 20px -12px rgba(0,0,0,.75); }

/* ===== ui_redesign_voice.html ===== */
.group{ border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .group .gt{ font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }

  .crow{ display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  .vlist{ display: flex; flex-direction: column; gap: 10px; }
  .vcard{ display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: var(--r-md); background: var(--surface); cursor: pointer; transition: border-color var(--dur-1), background var(--dur-1); }
  .vcard.on{ border-color: var(--accent-1); background: var(--accent-soft-1); }
  .vcard .vk{ width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--font-mono); font-size: 11px; color: var(--accent-1); background: var(--bg-2); border: 1px solid var(--line); }
  .vcard .vmeta{ display: flex; flex-direction: column; gap: 2px; }
  .vcard .vn{ font-weight: 600; color: var(--ink); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .vcard .vtier{ font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; color: var(--ink-3);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .vcard .vd{ font-size: 11px; color: var(--ink-3); }
  .vcard .act{ margin-left: auto; font-size: 11px; color: var(--accent-1); background: transparent;

  /* 列表下方的「＋ 添加」按钮（聊天模型配置 / 云端语音等多处复用） */
  .addbtn{ margin-top: 8px; padding: 11px 14px; width: 100%; border: 1px dashed var(--line); border-radius: var(--r-md);

    transition: border-color var(--dur-1), background var(--dur-1); }
  .addbtn:hover{ border-color: var(--accent-1); background: var(--accent-soft-1); }

  /* 模型卡片（选厂商→自动列出该家模型→点选回填模型名，与引导页同款） */
  .model-list{ display:flex; flex-direction:column; gap:8px; margin:4px 0 2px; }
  .model-card{ display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--line); border-radius:12px; background:var(--surface); cursor:pointer; transition:border-color .15s, background .15s; }

  .model-card.on{ border-color:var(--accent-1); background:var(--accent-soft-1); }
  .model-card .micon{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; flex:none; font-size:12px; font-weight:700; color:var(--accent-1); background:var(--bg-2); border:1px solid var(--line); }
  .model-card .mmeta{ flex:1; min-width:0; }
  .model-card .mn{ font-weight:600; color:var(--ink); font-size:13.5px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .model-card .md{ font-size:12px; color:var(--ink-2); margin-top:2px; }
  .model-card .mtag{ font-size:10px; padding:2px 7px; border-radius:6px; border:1px solid var(--line); color:var(--ink-3); }
  .model-card .mtag.vision{ border-color:var(--accent-1); color:var(--accent-1); }
  .model-card .mact{ margin-left:auto; font-size:12px; color:var(--accent-1); background:transparent; border:1px solid var(--line); border-radius:99px; padding:5px 12px; pointer-events:none; }
  .model-card.on .mact{ border-color:var(--accent-1); }

  /* 克隆展开区 */
  .clone-pane{ display: none; flex-direction: column; gap: 14px; margin-top: 4px; border-top: 1px solid var(--line); padding-top: 16px; }
  .clone-pane.show{ display: flex; }
  .sub{ border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); cursor: pointer; transition: border-color var(--dur-1), background var(--dur-1); }
  .sub.on{ border-color: var(--accent-1); background: var(--accent-soft-1); }
  .sub-head{ display: flex; align-items: center; justify-content: space-between; }
  .sub-title{ font-weight: 600; font-size: 14px; color: var(--ink); }
  .sub-tag{ font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .sub-desc{ font-size: 11px; color: var(--ink-3); line-height: 1.5; }
  /* 页面标题下的副标题：纯小字，绝不框起来（覆盖全局 .sub 方框规则） */
  .top .sub{ border: none; background: transparent; padding: 2px 0 0; border-radius: 0; cursor: default; gap: 0; }
  .dl{ display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .dl-bar{ height: 8px; border-radius: 99px; background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; }
  .dl-fill{ height: 100%; width: 0%; background: var(--accent-grad); border-radius: 99px; transition: width .25s var(--ease); }
  .dl-row{ display: flex; align-items: center; gap: 12px; }
  .dl-pct{ font-family: var(--font-mono); font-size: 12px; color: var(--accent-1); min-width: 42px; }
  .dl-state{ font-size: 11px; color: var(--ink-3); flex: 1; }

  /* 云端表单 */
  .form{ display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .form label{ display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .form input, .form select{ font: inherit; font-size: 13px; color: var(--ink); background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 9px 12px; outline: none; transition: border-color var(--dur-1), box-shadow var(--dur-1); }
  .form input:focus, .form select:focus{ border-color: var(--line-strong); box-shadow: 0 0 0 3px var(--accent-soft-1); }
  .btn{ font: inherit; cursor: pointer; border-radius: var(--r-md); padding: 9px 16px; font-size: 13px; border: 1px solid var(--line); background: transparent; color: var(--ink); transition: border-color var(--dur-1), background var(--dur-1), transform var(--dur-1); }
  .btn.primary{ background: var(--accent-grad); color: var(--on-accent); border-color: transparent; font-weight: 600; }
  .btn:hover{ border-color: var(--accent-1); }
  .btn:active{ transform: translateY(1px); }
  .btn[disabled]{ opacity: .5; cursor: default; }
  .btnrow{ display: flex; gap: 12px; align-items: center; }
  .toast{ font-size: 11px; color: var(--accent-1); opacity: 0; transition: opacity var(--dur-1); }
  .toast.show{ opacity: 1; }

  /* 设置页 .field 输入框：与 .form 输入控件共用同一套设计令牌，确保全页一致。
     ⚠️ 只针对 .field 内的 input/select/label，不改动 .field 的 display——
     主聊天页 .composer .field 是「按钮+textarea+按钮」的行布局，里面没有 input/select/label，故不受影响。 */
  .field label{ display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .field input, .field select{
    font: inherit; font-size: 13px; color: var(--ink);
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 9px 12px; outline: none;
    width: 100%; transition: border-color var(--dur-1), box-shadow var(--dur-1);
  }
  .field input:focus, .field select:focus{ border-color: var(--line-strong); box-shadow: 0 0 0 3px var(--accent-soft-1); }
  .field input::placeholder{ color: var(--ink-4); }

  /* 陪你看视频·进度条（2026-10-01）：后端看视频各阶段进度，独立 DOM 显示，不进聊天历史 */
  .vw-bar{
    position: fixed; left: 50%; bottom: 18px;
    transform: translateX(-50%) translateY(20px);
    display: flex; align-items: center; gap: 10px;
    max-width: calc(100vw - 32px);
    padding: 10px 16px; border-radius: var(--r-md);
    background: var(--surface-1); border: 1px solid var(--line);
    box-shadow: var(--shadow-pop);
    color: var(--ink-1); font-size: 13px; line-height: 1.3;
    opacity: 0; pointer-events: none; z-index: 9000;
    transition: opacity .25s ease, transform .25s ease;
  }
  .vw-bar.vw-show{ opacity: 1; transform: translateX(-50%) translateY(0); }
  .vw-bar.vw-done{ border-color: var(--accent-1); }
  .vw-spin{
    width: 16px; height: 16px; flex: 0 0 auto; border-radius: 50%;
    border: 2px solid var(--line-strong);
    border-top-color: var(--accent-1);
    animation: vw-spin .8s linear infinite;
  }
  .vw-bar.vw-done .vw-spin{ display: none; }
  .vw-pct{ color: var(--accent-1); font-variant-numeric: tabular-nums; margin-left: 2px; }
  @keyframes vw-spin{ to{ transform: rotate(360deg); } }

  /* 陪你看视频·诊断卡（2026-10-01，开发者页）：依赖状态 + 最近观看记录 */
  .kv .v.on{ color: var(--ok); }
  .kv .v.off{ color: var(--bad); }
  .vod-runs{ display: flex; flex-direction: column; gap: 6px; }
  .vod-row{
    padding: 8px 10px; border-radius: var(--r-sm, 8px);
    border: 1px solid var(--line); background: var(--surface-2);
    font-size: 11px; line-height: 1.45;
  }
  .vod-row.ok{ border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .vod-row.bad{ border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .vod-h{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--ink-1); }
  .vod-dot{ width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--ink-3); }
  .vod-row.ok .vod-dot{ background: var(--ok); }
  .vod-row.bad .vod-dot{ background: var(--bad); }
  .vod-tag{
    padding: 0 6px; border-radius: 999px; font-size: 10px;
    background: var(--accent-soft-1); color: var(--accent-1);
  }
  .vod-el{ color: var(--ink-3); }
  .vod-u{ color: var(--ink-2); word-break: break-all; margin-top: 2px; }
  .vod-err{ color: var(--bad); margin-top: 2px; }
  .vod-st{ color: var(--ink-3); margin-top: 2px; font-family: var(--font-mono, ui-monospace, monospace); font-size: 10px; }
  .vod-empty{ color: var(--ink-3); font-size: 11px; padding: 6px 0; }

  /* 免费额度耗尽·询问浮层（2026-10-02）：挂 body 全局可见，只询问不自动切换 */
  .qa-box{
    position: fixed; left: 50%; bottom: 18px; z-index: 9100;
    transform: translateX(-50%) translateY(20px);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    max-width: calc(100vw - 32px);
    padding: 12px 16px; border-radius: var(--r-md);
    background: var(--surface-1); border: 1px solid var(--line);
    border-left: 3px solid var(--warn);

  }

  .qa-ic{ flex: 0 0 auto; display: flex; align-items: center; }
  .qa-dot{ width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
  .qa-main{ flex: 1 1 220px; min-width: 180px; }

  /* 设置页"需先准备外部桥"等信息条：与 .card / .badge.note 同族，统一用设计令牌 */
  .zone-banner{

  }
  .zone-banner .zb-ico{ flex: none; width: 22px; height: 22px; display: grid; place-items: center; color: var(--accent-1); }
  .zone-banner .zb-ico i{ font-size: 18px; line-height: 1; }
  .zone-banner .zb-text{ display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .zone-banner .zb-title{ font-size: 13px; font-weight: 600; color: var(--ink); }

  .range-row{ display: flex; align-items: center; gap: 14px; }
  .range-row input[type="range"]{ flex: 1; accent-color: var(--accent-1); }
  .range-row .val{ font-family: var(--font-mono); font-size: 12px; color: var(--accent-1); min-width: 38px; text-align: right; }

/* ===== ui_redesign_daily.html ===== */

/* ===== 日报：卡片默认展示 + 展开/返回（同款 morph 控件） ===== */
.deck{ margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.deck-bar{ display: flex; align-items: center; gap: 14px; }
.deck-mid{ flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; }

/* 展开 / 返回：与返回按钮同款控件（左上，morph 形变 expand↔chevronLeft） */

.navbtn{ width: 44px; flex: none; height: 38px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 12px; cursor: pointer; display: grid; place-items: center; transition: border-color .15s, color .15s, background .15s; }
.navbtn:hover{ border-color: var(--accent-2); color: var(--accent-2); }
.navbtn svg{ width: 20px; height: 20px; transform-origin: center; }

.deck-hint{ font-size: 12px; color: var(--ink-3); margin: 2px 2px 0; }
.daily-app[data-expanded="true"] .deck-hint{ display: none; }

.deck-body{ display: flex; flex-direction: column; gap: 14px; }
.deck-body.week{ display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; align-items: start; }

/* 天卡（正方形风格，默认就展示内容） */

.daycard.empty .rhead h3{ color: var(--ink-3); }
.daycard .rhead{ display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.daycard .rhead h3{ font-size: var(--fs-lg); font-weight: 650; }
.daycard .rdate{ font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3); }
.daycard .rbody{ display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.daycard .rbody p{ margin: 0; font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.6; }
.daycard .rbody h3{ margin: 0; font-size: 15px; font-weight: 600; }
.daycard .actions{ display: flex; gap: 10px; }
/* 折叠态：卡片限高 + 底部渐隐，导出/复制默认隐藏（展开后显示） */
.daycard.compact{ height: 240px; max-height: 240px; position: relative; }
.daycard.compact::after{ content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: linear-gradient(transparent, var(--surface)); pointer-events: none; border-radius: 0 0 var(--r-lg) var(--r-lg); }
.daycard.compact .actions{ display: none; }
.daily-app[data-expanded="true"] .daycard .rbody{ overflow: visible; }

.expbar{ grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
.expbar-tip{ font-size: 12px; color: var(--ink-3); }

/* ===== ui_redesign_characters.html ===== */
.grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .ccard{ background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 20px; display: flex; flex-direction: column; gap: 14px; transition: border-color var(--dur-2), box-shadow var(--dur-2), transform var(--dur-2); }
  .ccard:hover{ border-color: var(--line-strong); box-shadow: var(--shadow-2); transform: translateY(-3px); }
  .chead{ display: flex; gap: 14px; align-items: center; }
  .cav{ width: 60px; height: 60px; border-radius: 16px; flex: none; overflow: hidden; border: 1px solid var(--line-2); background: var(--surface-3); }
  .cav img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 角色卡头图（2026-09-29）：整幅出血到卡片左右/上边缘，负外边距抵掉 .ccard 的 20px padding，
     圆角只保留上方两个，看起来像卡片自带的封面而不是贴上去的小图。 */
  .cbanner{ margin: -20px -20px 0; height: 104px; flex: none; overflow: hidden; position: relative;
    border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--accent-grad-soft); }
  .cbanner img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 底部渐隐：让头图与卡片内容自然衔接，避免硬切一条边 */
  .cbanner::after{ content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 38px;
    background: linear-gradient(to bottom, transparent, var(--surface)); opacity: .85; }
  /* 编辑器里的头图预览 */
  .banner-pick{ display: flex; gap: 12px; align-items: center; }
  .banner-prev{ width: 132px; height: 74px; flex: none; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center;
    color: var(--ink-3); font-size: 12px; }
  .banner-prev img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .cname{ font-size: 19px; font-weight: 650; }
  .ctag{ display: inline-block; font-size: 10.5px; letter-spacing: .04em; color: var(--accent-1); background: var(--accent-soft-1); border: 1px solid var(--line-strong); padding: 2px 10px; border-radius: 99px; margin-top: 5px; }
  .cdesc{ font-size: 13px; color: var(--ink-2); line-height: 1.62; }
  .cmeta{ display: flex; flex-wrap: wrap; gap: 8px; }
  .pill{ font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; background: var(--surface-2); }
  .caction{ display: flex; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); margin-top: auto; }
  .caction .btn{ flex: 1; justify-content: center; }

/* ===== 角色编辑模态框（当前风格） ===== */
.edit-mask{ position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; background: var(--mask); backdrop-filter: blur(4px); padding: 24px; }
.edit-mask.show{ display: flex; }
/* 卡片底一律走 --bg-2（实心、跟随深浅模式）；
   原来写 var(--surface-1)，而 --surface-1 根本没定义 → 永远回退成硬编码深色块 */
.edit-card{ width: min(640px, 96vw); max-height: 88vh; display: flex; flex-direction: column; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 18px; box-shadow: 0 24px 70px rgba(0,0,0,.45); overflow: hidden; }
.edit-head{ display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.edit-title{ font-weight: 700; font-size: 16px; }
.edit-x{ background: none; border: none; color: var(--ink-3); font-size: 18px; cursor: pointer; }
.edit-body{ padding: 18px 20px; overflow: auto; }
.edit-foot{ display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
.edit-try{ font-size: var(--fs-sm); color: var(--ink-3); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edit-foot .act-del{ color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, transparent); }
.edit-foot .act-del:hover{ background: color-mix(in srgb, var(--err) 14%, transparent); }
.form-row2{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row3{ display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; }
.fg{ display: flex; flex-direction: column; gap: 6px; }
.fg label{ font-size: 12px; color: var(--ink-2); }
.fg .req{ color: var(--err); }
.form textarea{ font: inherit; font-size: 13px; color: var(--ink); background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 9px 12px; outline: none; resize: vertical; transition: border-color var(--dur-1), box-shadow var(--dur-1); }
.form textarea:focus{ border-color: var(--line-strong); box-shadow: 0 0 0 3px var(--accent-soft-1); }
.tpl-row{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tpl-label{ font-size: 12px; color: var(--ink-3); }
.tpl-chip{ font-size: var(--fs-sm); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; transition: all .15s ease; }
.tpl-chip:hover{ border-color: var(--accent-2); color: var(--accent-2); }
  .ccard.dev{ border-style: dashed; background: var(--surface-2); box-shadow: none; }
  .ccard.dev .cav{ background: var(--line-2); display: grid; place-items: center; color: var(--ink-3); font-size: 22px; font-weight: 700; }
  .ccard.dev:hover{ transform: none; border-color: var(--line-2); box-shadow: none; }
  .ccard.dev .cname{ color: var(--ink-3); }
  .ctag.dev{ color: var(--ink-3); background: transparent; border: 1px solid var(--line-2); }
  .ghost{ font-size: 13px; color: var(--ink-3); line-height: 1.6; }

  /* ===== 角色档案弹窗（内联 style 抽类 · 2026-09-30） ===== */
  .archive-mask{ position: fixed; inset: 0; z-index: 9998; display: none; align-items: center; justify-content: center; background: var(--mask); backdrop-filter: blur(4px); }
  .archive-mask.show{ display: flex; }
  .archive-card{ width: min(520px, 92vw); max-height: 82vh; overflow: auto; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 18px; padding: 20px; box-shadow: var(--shadow-pop); }
  .archive-banner{ margin: -20px -20px 14px; height: 118px; border-radius: 18px 18px 0 0; overflow: hidden; background: var(--accent-grad-soft); }
  .archive-banner img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .archive-head{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .archive-title{ font-weight: 700; font-size: 16px; }
  .archive-close{ background: none; border: none; color: var(--ink-3); font-size: 18px; cursor: pointer; }
  .archive-field{ margin-bottom: 12px; }
  .archive-label{ font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }

  /* ===== 角色卡入场动画（gsap→CSS · 2026-09-30） ===== */
  .ccard{ animation: cardIn .5s cubic-bezier(.16,1,.3,1) backwards; }
  .ccard.skeleton{ animation: none; pointer-events: none; }
  @keyframes cardIn{ from{ opacity: 0; transform: translateY(16px); } }
  @media (prefers-reduced-motion: reduce){ .ccard{ animation: none; } }

  /* ===== 角色列表骨架屏（2026-09-30） ===== */
  .skeleton{ position: relative; overflow: hidden; }
  .skeleton::after{ content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 9%, transparent), transparent); animation: skShimmer 1.2s infinite; }
  .sk-line{ height: 12px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 10%, transparent); margin: 8px 0; }
  @keyframes skShimmer{ to{ transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce){ .skeleton::after{ animation: none; } }

.badge{ font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--ink-3); }

  .dbg-bar-wrap{ margin-top: 6px; height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .dbg-bar-fill{ height: 100%; border-radius: 99px; background: var(--accent-grad); transition: width .3s var(--ease); }
  .timeline .dbg-tag{ margin-left: 7px; }

/* ============================================================
   切换预检：面板下沿进度条 + 不可用确认弹窗（2026-08-31）
   用于「双工引擎切换 / 语音克隆引擎切换」——切换前先探测目标可用
   性，不可用弹窗拦一道；切换过程中用贴边进度条给出进度反馈。
   ============================================================ */

/* 进度条贴在卡片下沿，平时完全隐藏（不占布局、无视觉噪声）。
   父容器需 position:relative + overflow:hidden 才能贴合圆角。 */
.sw-host{ position: relative; overflow: hidden; }
.sw-prog{
  position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
  background: transparent; pointer-events: none;
  opacity: 0; transition: opacity .25s ease; z-index: 2;
}
.sw-prog.on{ opacity: 1; }
.sw-prog i{
  display: block; height: 100%; width: 0%;
  background: var(--accent-1);
  transition: width .35s ease;
  box-shadow: 0 0 8px var(--accent-soft-1);
}
/* 不确定进度（等待后端响应）：来回滑动的短条，表示"在动但不知道还要多久" */
.sw-prog.indet i{
  width: 32% !important;
  animation: swIndet 1.1s ease-in-out infinite;
  transition: none;
}
@keyframes swIndet{
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(312%); }
}
@media (prefers-reduced-motion: reduce){
  .sw-prog.indet i{ animation: none; width: 100% !important; opacity: .5; }
}

/* 预检不通过时的确认弹窗 */
.sw-mask{
  position: fixed; inset: 0; z-index: 9999;
  background: var(--mask);
  display: grid; place-items: center; padding: 24px;
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.sw-mask.on{ opacity: 1; pointer-events: auto; }
.sw-modal{
  width: min(420px, 100%);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 22px;
  transform: translateY(8px) scale(.98); transition: transform .18s ease;
}
.sw-mask.on .sw-modal{ transform: none; }
.sw-modal h3{
  margin: 0 0 10px; font-size: 15px; font-weight: 600; color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.sw-modal h3 .sw-ico{
  width: 20px; height: 20px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
  background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn);
}
.sw-modal p{ margin: 0 0 8px; font-size: 13px; line-height: 1.65; color: var(--ink-2); }
.sw-modal .sw-detail{
  font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3);
  background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 8px 10px; margin: 10px 0 6px; word-break: break-word;
}
.sw-modal .sw-hint{ font-size: 12px; color: var(--ink-3); }
.sw-btns{ display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.sw-btns button{
  padding: 8px 16px; border-radius: var(--r-sm); font-size: 13px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  transition: background var(--dur-1), border-color var(--dur-1);
}
.sw-btns button:hover{ background: var(--accent-soft-1); }
.sw-btns .sw-ok{ border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); }
.sw-btns .sw-ok:hover{ background: color-mix(in srgb, var(--warn) 14%, transparent); }

/* ===== 云端双工容量徽标（设置 / 运行模式 / 开发者 三页共用） ===== */
.cap-badge{ display:inline-block; font-family: var(--font-mono); font-size: 11px; line-height: 1;
  letter-spacing: .02em; padding: 5px 10px; border-radius: 999px; border: 1px solid transparent; }
.cap-ok{ color: var(--ok); border-color: color-mix(in srgb, var(--ok) 42%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.cap-full{ color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); background: color-mix(in srgb, var(--err) 12%, transparent); }
.cap-local{ color: var(--accent-1); border-color: color-mix(in srgb, var(--accent-1) 45%, transparent); background: color-mix(in srgb, var(--accent-1) 12%, transparent); }
.cap-unknown{ color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
/* 开发者页 KV 单元格里也复用同一组语义色 */
.v.cap-ok{ color: var(--ok); }
.v.cap-full{ color: var(--err); }
.v.cap-local{ color: var(--accent-1); }
.v.cap-unknown{ color: var(--warn); }
/* 运行模式弹窗里的容量提示行 */
.msec-cap{ margin-top: 10px; }

/* ===== 对话引擎 · WorkBuddy 式居中弹窗（由 app_backend.js 动态创建于 body） ===== */
.eng-modal-mask{
  position: fixed; inset: 0; z-index: 9998;
  background: var(--mask-strong);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: grid; place-items: center; padding: 24px;
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.eng-modal-mask.on{ opacity: 1; pointer-events: auto; }
.eng-modal{
  width: min(420px, 100%);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 20px;
  box-shadow: var(--shadow-pop);
  transform: translateY(10px) scale(.99); transition: transform .2s ease;
}
.eng-modal-mask.on .eng-modal{ transform: none; }
.eng-modal-head{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.eng-modal-head > span{ font-size: 15px; font-weight: 650; color: var(--ink); }
.eng-modal-head .x{
  width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface-2); color: var(--ink-2); cursor: pointer; font-size: 12px;
  transition: border-color .2s ease, color .2s ease;
}
.eng-modal-head .x:hover{ border-color: var(--line-strong); color: var(--ink); }
.eng-auto-row{ display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.eng-row-t .er-t{ font-size: 13.5px; font-weight: 600; color: var(--ink); }
.eng-row-t .er-s{ font-size: 11px; color: var(--ink-3); margin-top: 3px; max-width: 262px; line-height: 1.4; }
.eng-divider{ height: 1px; background: var(--line); margin: 16px 0; }
.eng-opts{ display: flex; flex-direction: column; gap: 9px; }
.eng-opt{ display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  cursor: pointer; text-align: left; color: var(--ink); transition: border-color .2s ease, background .2s ease; }
.eng-opt:hover{ border-color: var(--line-strong); background: var(--surface-3); }
.eng-opt.sel{ border-color: var(--accent-1); background: var(--accent-soft-1); }
.eng-opt.dis{ opacity: .45; cursor: not-allowed; filter: grayscale(.6); }
.eng-opt.dis:hover{ border-color: var(--line); background: var(--surface); }
.eng-opt.dis.sel{ border-color: var(--accent-1); background: var(--accent-soft-1); }
.eng-opt .eo-t{ display: flex; flex-direction: column; gap: 2px; }
.eng-opt .eo-t b{ font-size: 13px; font-weight: 600; }
.eng-opt .eo-sub{ font-size: 11px; color: var(--ink-3); }
.eng-opt .pick{ width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2px solid var(--line-2); }
.eng-opt.sel .pick{ border-color: var(--accent-1); background: var(--accent-1); box-shadow: inset 0 0 0 3px var(--bg-2); }
.eng-note{ font-size: 11px; line-height: 1.55; color: var(--ink-3); margin-top: 14px; }
.eng-modal-foot .sw-host{ margin-top: 2px; }
/* 自动切换开关（iOS 风拨杆） */
.eng-switch{
  position: relative; width: 44px; height: 25px; flex: none; border-radius: 999px;
  background: var(--line-strong); cursor: pointer; border: 1px solid transparent;
  transition: background .2s ease; outline: none;
}
.eng-switch:focus-visible{ box-shadow: 0 0 0 3px var(--accent-soft-1); }
.eng-switch::after{
  content: ''; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px;
  border-radius: 50%; background: var(--knob); box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
  transition: transform .2s ease;
}
.eng-switch.on{ background: var(--accent-1); }
.eng-switch.on::after{ transform: translateX(19px); }

/* ===== 聊天输入框锁定（所有文本端口不可用时锁死输入） ===== */
.composer{ position: relative; }
.composer.locked .field{ opacity: .5; filter: grayscale(.35); transition: opacity var(--dur-1), filter var(--dur-1); }
.chat-lock{
  position: absolute; inset: 0; z-index: 6;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 16px;
  background: color-mix(in srgb, var(--bg-2) 82%, transparent);
  border: 1px solid var(--accent-2);
  border-radius: var(--r-lg);
  color: var(--ink-2);
  font-size: 12.5px; line-height: 1.45; text-align: center;
  backdrop-filter: blur(3px);
  pointer-events: none;            /* 仅作视觉提示，禁用由 textarea/button 承担 */
  opacity: 0; transform: translateY(6px);
  transition: opacity var(--dur-1) ease, transform var(--dur-1) ease;
}
.chat-lock.show{ opacity: 1; transform: none; }
.chat-lock .cl-ic{ flex: none; width: 18px; height: 18px; color: var(--err); }
@media (prefers-color-scheme: light){
  .chat-lock{ background: color-mix(in srgb, var(--bg-2) 86%, transparent); }
}

/* ===== 聊天模型切换进度条（打字发送时显示：自动=选模型 / 手动=连指定端口） ===== */
.chat-switch-bar{
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px; opacity: 0; height: 0; overflow: hidden;
  transition: opacity var(--dur-1) ease, height var(--dur-1) ease, padding var(--dur-1) ease;
}
.chat-switch-bar.show{ opacity: 1; height: 18px; padding: 4px 12px 6px; }
.csb-bar{
  position: relative; flex: 1; height: 4px; border-radius: 3px;
  background: var(--surface-3); overflow: hidden;
}
.csb-bar > i{
  position: absolute; top: 0; bottom: 0; left: -40%; width: 40%; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
  animation: csbSlide 1.1s ease-in-out infinite;
}
@keyframes csbSlide{ 0%{ left: -40%; } 100%{ left: 100%; } }
.csb-txt{ flex: none; font-size: 11px; color: var(--ink-2); white-space: nowrap; }
@media (prefers-color-scheme: light){
  .csb-bar{ background: var(--surface-3); }
  .csb-txt{ color: var(--ink-2); }
}

/* ===== 聊天页"推理模型"切换器（输入框旁的模型药丸 + 下拉面板） =====
   2026-09-29 令牌化修复：本块原先引用 --panel-bg / --line-1 / --glass-1 / --glass-2，
   这四个量在 design_tokens.css 里从未定义，var() 只能永久落在写死的深色兜底（#161b27）
   上 → 面板成了不跟随主题/强调色的硬编码深色块，与聊天页整体极不协调。
   现统一接真实令牌：实心弹层底 → --surface-1(=--bg-2)；描边 → --line；
   hover → --surface-3；选中 → --accent-soft-1（自动跟随强调色预设与深浅主题）。 */
.model-pill{
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  min-width: 104px; max-width: 200px; box-sizing: border-box;
  padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 11px; background: var(--surface-2);
  color: var(--ink); font-size: 12px; cursor: pointer; user-select: none;
  transition: border-color var(--dur-1) ease, background var(--dur-1) ease;
}
.model-pill:hover{ border-color: var(--accent-1); }
.model-pill.open{ border-color: var(--accent-1); background: var(--accent-soft-1); }
.model-pill .mp-ic{ font-size: 12px; opacity: .8; }
.model-pill .mp-name{ flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-pill .mp-caret{ opacity: .6; font-size: 10px; }
.model-pill .mp-auto{ flex: none; font-size: 10px; line-height: 1; padding: 2px 5px; border-radius: 6px; background: var(--accent-soft-1); color: var(--accent-1); font-weight: 600; letter-spacing: .02em; }
.model-pill .mp-auto[hidden]{ display: none; }
.model-panel{
  position: absolute; left: 12px; right: 12px; bottom: calc(100% + 8px);
  max-width: 360px;
  max-height: 320px; overflow-y: auto; z-index: 40;
  padding: 8px; border-radius: var(--r-lg);
  background: var(--surface-1); border: 1px solid var(--line);
  box-shadow: var(--shadow-pop);
}
.model-panel[hidden]{ display: none; }
.mp-custom{ display: flex; gap: 6px; padding: 4px 2px 8px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.mp-custom input{
  flex: 1; min-width: 0; padding: 7px 10px; border-radius: 9px; font-size: 12px;
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--ink); outline: none;
}
.mp-custom input:focus{ border-color: var(--accent-1); }
.mp-custom button{
  flex: none; padding: 7px 12px; border-radius: 9px; border: none; cursor: pointer;
  background: var(--accent-1); color: var(--on-accent); font-size: 12px; font-weight: 600;
}
.mp-sec{ margin-top: 4px; }
.mp-sec + .mp-sec{ margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.mp-custom + .mp-sec{ margin-top: 8px; }
.mp-sec-t{ font-size: 11px; color: var(--ink-3); padding: 4px 6px; }
/* 行：统一行高 + 三列布局（名称 | 模型ID右对齐 | 勾固定宽），保证跨行垂直对齐 */
.mp-item{
  display: flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 6px 10px; border-radius: 10px; cursor: pointer;
  color: var(--ink); font-size: 13px; line-height: 1.35; box-sizing: border-box;
}
.mp-item:hover{ background: var(--surface-3); }
.mp-item.on{ background: var(--accent-soft-1); }
.mp-item .mp-i-name{ flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-item .mp-i-model{
  flex: 0 0 auto; min-width: 0; max-width: 46%;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-3);
  text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mp-item .mp-check{ flex: 0 0 auto; width: 14px; text-align: center; color: var(--accent-1); font-weight: 700; }
/* ===== 模型能力 chips（列表内紧凑图标） ===== */
.mp-item .mp-caps{ flex: 0 0 auto; display: inline-flex; align-items: center; gap: 3px; margin-left: 2px; }
.mp-item .mp-caps .cap-chip{ display: inline-flex; align-items: center; justify-content: center;
  width: 19px; height: 19px; border-radius: 6px; color: var(--accent-1);
  background: var(--accent-soft-1); border: 1px solid color-mix(in srgb, var(--accent-1) 22%, transparent); }
.mp-item .mp-caps .cap-chip svg{ width: 13px; height: 13px; }
/* 纯文本折叠标：低调，不抢视觉，仅表明“仅文字对话” */
.mp-item .mp-caps .cap-chip-text{ width: auto; padding: 0 7px; color: var(--ink-3); background: transparent;
  border: 1px solid var(--line-2); font-size: 11px; font-weight: 600; }
.mp-item.has-caps{ cursor: help; }
/* ===== 模型能力悬浮卡（鼠标停顿显示） ===== */
.mp-cap-tip{
  position: fixed; z-index: 9999; width: 264px; max-width: 86vw;
  padding: 12px 13px; border-radius: var(--r-md);
  background: var(--surface-1); border: 1px solid var(--line-2);
  box-shadow: var(--shadow-pop); color: var(--ink);
  font-size: 12px; line-height: 1.5; pointer-events: none;
  animation: capTipIn .14s var(--ease-out);
}
.mp-cap-tip[hidden]{ display: none; }
@keyframes capTipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.capc-row{ display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.capc-row:last-of-type{ margin-bottom: 0; }
.capc-k{ flex: 0 0 auto; width: 30px; color: var(--ink-3); font-size: 11px; padding-top: 3px; }
.capc-v{ flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 5px; }
.capc-tag{ display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 5px;
  border-radius: 99px; font-size: 11.5px; color: var(--ink-2);
  background: var(--surface-3); border: 1px solid var(--line); }
.capc-tag svg{ width: 13px; height: 13px; color: var(--accent-1); flex: 0 0 auto; }
.capc-desc{ margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
  color: var(--ink-2); font-size: 11.5px; }
.capc-verified{ margin-top: 6px; color: var(--ok); font-size: 11px; }
.capc-inferred{ margin-top: 6px; color: var(--warn); font-size: 11px; }
</style>
