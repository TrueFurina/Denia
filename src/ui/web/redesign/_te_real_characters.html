  <style>
    *{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
    input, textarea, select, [contenteditable="true"]{ -webkit-user-select:text; user-select:text; }
    ::selection{ background:rgba(124,92,255,.25); }
    img, canvas, svg, video{ -webkit-user-drag:none; user-drag:none; }
    body{ -webkit-user-drag:none; }
  </style>

  <!-- ⭐ 用户裁决（2026-10-05）：角色卡头图 = 【整张卡片的背景】，不是卡内那一小条。
       故第四版的「卡内通栏 76px」方案作废，.cbanner 整条移除。
       图走 --tm-cover 变量 + .ccard.has-cover（design_tokens.css?v=20261007g 里那套），
       与生产 theme_manager.js 的落点完全一致 ⇒ 编辑器里看到的就是产品里出现的。
       这里的渐变只是示例占位；编辑器填图时会改写 --tm-cover。 -->
  <!-- 🔴 2026-10-06 修：这里**绝不能**再写 `.ccard.has-cover{ --tm-cover: <示例> }`。
       自定义属性写在元素自身会盖掉父页小桥写在 <html> 上的真实值（自身声明 > 继承），
       于是「用户换了角色卡背景图，编辑器预览永远还是这张示例渐变」——
       这正是用户报的「角色卡换了图片，预览页不会变」的真因。
       现在示例渐变只在「没有真图（未挂 has-cover）且该位可用（非 .off）」时兜底，
       一旦小桥推来 has-cover + --tm-cover，示例自动让位。 -->
  <style>
    .ccard:not(.has-cover):not(.dev):not(.off){
      background-image: linear-gradient(120deg,#8E7BC6 0%,#C48BA6 42%,#E7C6A8 72%,#6E5B9A 100%);
    }
  </style>

  <!-- 预览小桥：父页要量坐标 / 写 --tm-* 时走 postMessage（file:// 或跨域预览下必须） -->
  <script src="_te_bridge.js"></script>
</head>

      <div class="grid">
        <article class="ccard has-cover">
          <!-- 真实头图位。产品里的顺序是 bannerHtml(c) + avatarHtml(c) + .chead + …
               （cbanner 在头像上方、出血到卡外）。本设计稿按第四版提案把它挪到

          <div class="chead">

        <article class="ccard dev">
